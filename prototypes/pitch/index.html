<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitCare Pitch</title>
<!-- OrbitCare pitch for the NASA Space Apps 2026 judges, English + Arabic.
     Story: a night on the way to Mars → NASA's challenge → the problem in numbers → OrbitCare → each part of the
     system (the problem it solves, how it works, the evidence) → why it can be trusted → live demo → impact →
     back to the same night, now with OrbitCare. Speaker notes are a full script, plus ready answers on the last slide.
     Keys: → / ← / Space / PageDown / PageUp (clickers) · N notes · L language · F full screen · Home / End.
     ?lang=ar|en · ?notes · #5 opens slide 5. Works offline: the fonts come from this project. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
:root {
    --space: #0c1230; --navy: #1b2350; --ink: #f4f6ff; --soft: #b9c2e6; --muted: #8590bd;
    --accent: #5b8cff; --accent-2: #8fb0ff; --warm: #ffb547; --warm-2: #ffd08a; --line: rgba(185, 194, 230, 0.18);
    --card: rgba(255, 255, 255, 0.055);
    --font: "Lexend", "IBM Plex Sans Arabic", system-ui, sans-serif;
}
[lang="ar"] { --font: "IBM Plex Sans Arabic", "Lexend", system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { overflow: hidden; background: #070b1f; color: var(--ink); font-family: var(--font); }
button, a { font: inherit; }

/* ---------- 16:9 stage scaled to the window; sizes in cqw/cqh so each slide scales as one picture */
.viewport { position: fixed; inset: 0; display: grid; place-items: center; }
body.notes-open .viewport { bottom: 14rem; }
.stage {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden;
    container-type: size;
    background:
        radial-gradient(1.2px 1.2px at 12% 18%, #fff8 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 12%, #fff6 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 64% 72%, #fff7 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 84%, #fff5 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 90% 58%, #fff6 50%, transparent 51%),
        radial-gradient(1px 1px at 46% 8%, #fff5 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 62%, #fff5 50%, transparent 51%),
        radial-gradient(ellipse 70% 60% at 85% 110%, rgba(91, 140, 255, 0.22), transparent 70%),
        radial-gradient(ellipse 60% 50% at 0% -10%, rgba(143, 176, 255, 0.12), transparent 70%),
        linear-gradient(160deg, var(--navy) 0%, var(--space) 70%);
}
body.notes-open .stage { width: min(100vw, calc((100vh - 14rem) * 16 / 9)); }

.slide {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
    padding: 9cqh 7cqw 8cqh; opacity: 0; visibility: hidden; transform: translateY(1.2cqh);
    transition: opacity 0.45s ease, transform 0.45s ease, visibility 0s linear 0.45s;
}
.slide.is-active { opacity: 1; visibility: visible; transform: none; transition: opacity 0.45s ease, transform 0.45s ease; }

.brand { position: absolute; top: 4.5cqh; inset-inline-start: 7cqw; display: flex; align-items: center; gap: 0.7cqw; font-size: 1.5cqw; font-weight: 600; color: var(--soft); }
.brand svg { width: 1.8cqw; height: 1.8cqw; color: var(--accent); }
.kicker { font-size: 1.3cqw; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); }
[lang="ar"] .kicker { letter-spacing: 0; font-size: 1.6cqw; text-transform: none; }
h1, h2 { font-weight: 600; line-height: 1.15; color: var(--ink); text-wrap: balance; }
h1 { margin-top: 1.4cqh; font-size: 4.6cqw; max-width: 74cqw; }
h2 { margin-top: 1.2cqh; font-size: 3.1cqw; max-width: 84cqw; }
[lang="ar"] h1 { font-size: 4.3cqw; line-height: 1.3; }
[lang="ar"] h2 { font-size: 2.9cqw; line-height: 1.35; }
.lead { margin-top: 3.4cqh; font-size: 1.9cqw; line-height: 1.5; color: var(--soft); max-width: 64cqw; }
.accent { color: var(--accent-2); }

/* "the problem this part solves" */
.why { margin-top: 2.6cqh; max-width: 82cqw; padding-inline-start: 1.3cqw; border-inline-start: 0.3cqw solid var(--warm); font-size: 1.75cqw; line-height: 1.45; color: var(--warm-2); }

/* cards (feature parts, challenge, impact, trust) */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6cqw; margin-top: 4cqh; }
.card { padding: 2.8cqh 1.8cqw; border: 1px solid var(--line); border-radius: 1.4cqw; background: var(--card); }
.card h3 { display: flex; align-items: center; gap: 0.8cqw; font-size: 1.8cqw; font-weight: 600; color: var(--ink); }
.card h3::before { content: ""; flex: none; width: 0.75cqw; height: 0.75cqw; border-radius: 50%; background: var(--accent); box-shadow: 0 0 1cqw var(--accent); }
.card p { margin-top: 1.3cqh; font-size: 1.42cqw; line-height: 1.5; color: var(--soft); }
.cards.is-check .card h3 { color: var(--accent-2); }
.cards.is-check .card h3::before { content: "✓"; width: auto; height: auto; background: none; box-shadow: none; color: var(--warm); font-size: 1.8cqw; }
.cards.is-6 { grid-template-rows: auto auto; gap: 1.4cqw; }
.cards.is-6 .card { display: flex; gap: 1.3cqw; padding: 2.4cqh 1.6cqw; }
.cards.is-6 .card h3::before { display: none; }
.cards.is-6 .card p { margin-top: 0.8cqh; font-size: 1.32cqw; }
.quote { margin-top: 2.6cqh; font-size: 1.65cqw; line-height: 1.5; color: var(--soft); max-width: 84cqw; }
.quote b { color: var(--ink); font-weight: 500; }

/* evidence strip */
.proof { display: flex; align-items: center; gap: 1.2cqw; margin-top: 3.2cqh; padding: 1.7cqh 1.8cqw; border: 1px solid rgba(255, 181, 71, 0.3); border-radius: 1.4cqw; background: rgba(255, 181, 71, 0.07); font-size: 1.45cqw; line-height: 1.45; color: var(--ink); }
.proof .icon-box { flex: none; width: 3.4cqw; height: 3.4cqw; background: rgba(255, 181, 71, 0.16); color: var(--warm); }
.proof .icon-box svg { width: 2cqw; height: 2cqw; }

.icon-box { display: grid; place-items: center; flex: none; width: 4.4cqw; height: 4.4cqw; border-radius: 1.1cqw; background: rgba(91, 140, 255, 0.16); color: var(--accent-2); }
.icon-box svg { width: 2.5cqw; height: 2.5cqw; }

/* stats (the problem in numbers, the sleep science) */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2cqw; margin-top: 4.5cqh; }
.stat { padding: 3cqh 2cqw; border: 1px solid var(--line); border-radius: 1.4cqw; background: var(--card); }
.stat b { display: block; font-size: 4.4cqw; font-weight: 600; color: var(--warm); font-variant-numeric: tabular-nums; }
.stat > span { display: block; margin-top: 1cqh; font-size: 1.5cqw; line-height: 1.45; color: var(--soft); }
.hazards { margin-top: 3.6cqh; font-size: 1.7cqw; line-height: 1.5; color: var(--soft); }
.cite { position: absolute; bottom: 3.6cqh; inset-inline-start: 7cqw; max-width: 60cqw; font-size: 1.02cqw; line-height: 1.5; color: var(--muted); }

/* flow (solution loop, sleep headband) */
.flow { display: grid; align-items: stretch; gap: 1.4cqw; margin-top: 4.5cqh; }
.step { padding: 3cqh 1.7cqw; border: 1px solid var(--line); border-radius: 1.4cqw; background: var(--card); }
.step h3 { margin-top: 2.2cqh; font-size: 2cqw; font-weight: 600; }
.step p { margin-top: 1.1cqh; font-size: 1.42cqw; line-height: 1.5; color: var(--soft); }
.step-num { float: inline-end; font-size: 1.3cqw; font-weight: 600; color: var(--muted); }

/* demo */
.demo { align-items: center; text-align: center; }
.demo h1 { max-width: none; font-size: 6.6cqw; }
.live-dot { display: inline-flex; align-items: center; gap: 0.8cqw; padding: 0.8cqh 1.6cqw; border-radius: 999px; background: rgba(255, 92, 110, 0.14); color: #ff8592; font-size: 1.5cqw; font-weight: 600; letter-spacing: 0.14em; }
[lang="ar"] .live-dot { letter-spacing: 0; }
.live-dot::before { content: ""; width: 1cqw; height: 1cqw; border-radius: 50%; background: #ff5c6e; animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.demo-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 1cqw; margin-top: 4cqh; padding: 0; list-style: none; }
.demo-list li { padding: 1cqh 1.4cqw; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 1.4cqw; color: var(--soft); }
.open-app { margin-top: 4.5cqh; display: inline-flex; align-items: center; gap: 1cqw; padding: 1.8cqh 3cqw; border-radius: 999px; background: var(--accent); color: #fff; font-size: 1.8cqw; font-weight: 600; text-decoration: none; box-shadow: 0 1cqh 4cqh rgba(91, 140, 255, 0.35); }
.open-app:hover { background: #4a7bf0; }

/* opening + closing: the same night, before and after */
.story .kicker { color: var(--warm); }
.orbit { position: absolute; inset-inline-end: -14cqw; top: 50%; width: 62cqw; aspect-ratio: 1; transform: translateY(-50%); border-radius: 50%; border: 1px solid rgba(143, 176, 255, 0.22); pointer-events: none; }
.orbit::before { content: ""; position: absolute; inset: 9cqw; border-radius: 50%; border: 1px dashed rgba(143, 176, 255, 0.18); }
.orbit::after { content: ""; position: absolute; top: 8%; left: 22.8%; translate: -50% -50%; width: 1.8cqw; height: 1.8cqw; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 3cqw var(--accent); }
[dir="rtl"] .orbit::after { left: auto; right: 22.8%; translate: 50% -50%; }
.big-star { position: absolute; inset-inline-end: 9cqw; top: 50%; width: 11cqw; height: 11cqw; transform: translateY(-50%); color: var(--accent); filter: drop-shadow(0 0 3cqw rgba(91, 140, 255, 0.6)); }
.closing h1 { max-width: 66cqw; }
.closing .lead { max-width: 60cqw; }

/* ---------- controls (fade out while the mouse rests) */
.progress { position: absolute; left: 0; bottom: 0; height: 0.5cqh; background: var(--accent); transition: width 0.45s ease; }
[dir="rtl"] .progress { left: auto; right: 0; }
.controls { position: fixed; bottom: 1rem; inset-inline-end: 1rem; z-index: 5; display: flex; align-items: center; gap: 0.35rem; padding: 0.35rem; border-radius: 999px; background: rgba(12, 18, 48, 0.82); border: 1px solid var(--line); backdrop-filter: blur(6px); transition: opacity 0.3s ease; }
body.idle .controls { opacity: 0; }
body.notes-open .controls { bottom: 15rem; }
.ctrl { min-width: 2.4rem; height: 2.4rem; padding: 0 0.8rem; border: 0; border-radius: 999px; background: transparent; color: var(--soft); font-size: 0.85rem; cursor: pointer; }
.ctrl:hover, .ctrl[aria-pressed="true"] { background: rgba(91, 140, 255, 0.2); color: #fff; }
.ctrl svg { width: 1.1rem; height: 1.1rem; vertical-align: middle; }
[dir="rtl"] .ctrl[data-prev] svg, [dir="rtl"] .ctrl[data-next] svg { transform: scaleX(-1); }
.count { direction: ltr; unicode-bidi: isolate; min-width: 3.4rem; text-align: center; font-size: 0.85rem; color: var(--soft); font-variant-numeric: tabular-nums; }

.notes { position: fixed; left: 0; right: 0; bottom: 0; height: 14rem; display: none; gap: 1.5rem; padding: 1rem 1.5rem; overflow-y: auto; background: #0b1029; border-top: 1px solid var(--line); }
body.notes-open .notes { display: flex; }
.notes h4 { flex: none; width: 9rem; font-size: 0.8rem; font-weight: 600; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.08em; }
[lang="ar"] .notes h4 { letter-spacing: 0; font-size: 0.9rem; }
.notes p, .notes li { font-size: 1.05rem; line-height: 1.7; color: var(--ink); }
.notes p + p, .notes p + ol, .notes ol + p { margin-top: 0.5rem; }
.notes ol { padding-inline-start: 1.2rem; display: grid; gap: 0.15rem; }
.notes strong { color: var(--warm-2); font-weight: 600; }

/* ---------- ?print (slides, one per page) and ?print=notes (slide + speaker script, A4) — used for the PDF copies */
body.print { overflow: visible; height: auto; }
body.print .viewport, body.print .controls, body.print .notes { display: none; }
.print-pages .page { break-after: page; overflow: hidden; }
.print-pages .page:last-child { break-after: auto; }
.print-pages .stage { width: 100%; }
.print-pages .slide { opacity: 1; visibility: visible; transform: none; transition: none; }
.print-pages .page--slide { width: 1600px; height: 900px; }
.print-pages .page--notes { width: 210mm; height: 297mm; padding: 12mm; background: #fff; color: #1b2340; }
.page-notes { margin-top: 7mm; font-size: 11.5pt; line-height: 1.65; }
.page-notes h4 { margin-bottom: 3mm; font-size: 10pt; font-weight: 600; color: #2f5fd8; }
.page-notes strong { color: #1b2350; }
.page-notes p + p, .page-notes p + ol, .page-notes ol + p { margin-top: 2.5mm; }
.page-notes ol { padding-inline-start: 6mm; }
@media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

@media (prefers-reduced-motion: reduce) { .slide, .progress { transition: none; } .live-dot::before { animation: none; } }
@media (max-width: 640px) { .notes { flex-direction: column; gap: 0.5rem; } .notes h4 { width: auto; } }
</style>
</head>
<body>
<div class="viewport">
    <main class="stage" data-stage aria-live="polite">
        <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.7 7.6 16.4 11.3 24 12C16.4 12.7 12.7 16.4 12 24C11.3 16.4 7.6 12.7 0 12C7.6 11.3 11.3 7.6 12 0Z" fill="currentColor"/></svg>OrbitCare</div>
        <div data-slides></div>
        <div class="progress" data-progress></div>
    </main>
</div>

<nav class="controls" aria-label="Slides">
    <button class="ctrl" type="button" data-prev><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="count" data-count></span>
    <button class="ctrl" type="button" data-next><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ctrl" type="button" data-notes aria-pressed="false"></button>
    <button class="ctrl" type="button" data-lang></button>
    <button class="ctrl" type="button" data-full></button>
</nav>
<aside class="notes" data-notes-panel><h4 data-notes-title></h4><div data-notes-body></div></aside>

<script>
// ---------------------------------------------------------------- icons
const ICON = {
    monitor: '<path d="M3 12h4l2-5 3.5 10 2.5-7 1.5 2H21"/>',
    understand: '<path d="M4 20h16M6.5 20v-6M10.5 20V9M14.5 20v-8M18.5 20V5"/>',
    detect: '<circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5l-4.8-4.8"/><path d="M8 11h1.5l1-2 1.5 4 1-2H15"/>',
    act: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    brain: '<path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-1.5 5.3A3 3 0 0 0 7 17.5a2.5 2.5 0 0 0 5 .5V5.5a2 2 0 0 0-3-1z"/><path d="M15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 1.5 5.3 3 3 0 0 1-2.5 4.7 2.5 2.5 0 0 1-5 .5"/>',
    wave: '<path d="M2.5 12c1.6-5.5 3.2-5.5 4.8 0s3.2 5.5 4.8 0 3.2-5.5 4.8 0 3.2 5.5 4.6 0"/>',
    sound: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
    adapt: '<path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="14" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="19" cy="15" r="2"/>',
    light: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
    book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    data: '<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>',
    offline: '<path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12a9.5 9.5 0 0 1 13 0M8.8 15.4a5 5 0 0 1 6.4 0"/><circle cx="12" cy="19" r="1.2"/>',
    lang: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.6 5.2 3.6 8.5S14.5 18.1 12 20.5C9.5 18.1 8.4 15.3 8.4 12S9.5 5.9 12 3.5z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    star: '<path d="M12 0C12.7 7.6 16.4 11.3 24 12C16.4 12.7 12.7 16.4 12 24C11.3 16.4 7.6 12.7 0 12C7.6 11.3 11.3 7.6 12 0Z" fill="currentColor" stroke="none"/>',
};
const svg = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;

// ---------------------------------------------------------------- content (English / Arabic)
// Every figure is sourced (verified for this project):
// · Mars communication delay up to ~20 min one way; bone loss 1–1.5 %/month; ISS exercise ~1.5 h/day — NASA Human Research Program.
// · ~6 h sleep, 75 % of ISS crew used sleep medication — Barger et al., Lancet Neurology 2014.
// · PVT-B 3 min, lapse ≥ 355 ms — Basner, Mollicone & Dinges 2011; ISS Reaction Self Test since 2009 — NASA Spinoff 2013.
// · Samn-Perelli fatigue scale; PHQ-4 — see docs/DATA_PROVENANCE.md.
// · Sleep: +16 % slow-wave activity in young adults with timed sounds (2018, PubMed 30215604); mistimed sounds −30 %
//   slow-wave sleep (Fehér 2023); Dreem dry-EEG headband worn on the ISS (DREAMS, 2023);
//   HERA lighting: −96 % brightness, warmer, in the 3 h before bed (Rahman et al. 2022).
const UI = {
    en: { notes: 'Notes', notes_title: 'Speaker script', lang: 'العربية', full: 'Full screen', open: 'Open OrbitCare', prev: 'Previous slide', next: 'Next slide' },
    ar: { notes: 'الملاحظات', notes_title: 'ماذا أقول', lang: 'English', full: 'ملء الشاشة', open: 'افتح OrbitCare', prev: 'الشريحة السابقة', next: 'الشريحة التالية' },
};

const SLIDES = [
    // 1 — a story the judges can picture (hook)
    {
        layout: 'story', cls: 'story', deco: 'orbit',
        en: {
            kicker: 'Day 140 · halfway to Mars · 03:00',
            title: 'An astronaut’s heart rate starts climbing. Earth is <span class="accent">20 minutes</span> away.',
            lead: 'Who notices? Who decides what to do — right now?',
            note: '<p>“Imagine day 140 of a mission to Mars. It’s three in the morning. One astronaut’s heart rate starts climbing, and their oxygen begins to drop.</p><p>On the International Space Station, a flight surgeon on Earth could react quickly. But on the way to Mars, a single message can take up to <strong>20 minutes — one way</strong>.</p><p>So who notices? And who decides what to do — right now? That is the question our project answers. We are [team name], and this is <strong>OrbitCare</strong>.”</p><p><em>Pause for two seconds after the question.</em></p>',
        },
        ar: {
            kicker: 'اليوم 140 · منتصف الطريق إلى المريخ · 3:00 فجرًا',
            title: 'نبض أحد الرواد يبدأ بالارتفاع. والأرض على بُعد <span class="accent">20 دقيقة</span>.',
            lead: 'مَن سيلاحظ؟ ومَن سيقرّر ماذا نفعل — الآن؟',
            note: '<p>«تخيّلوا اليوم 140 من رحلة إلى المريخ. الساعة الثالثة فجرًا. نبض أحد الرواد يبدأ بالارتفاع، والأكسجين في دمه يبدأ بالانخفاض.</p><p>على محطة الفضاء الدولية، يستطيع طبيب على الأرض أن يتدخّل بسرعة. لكن في الطريق إلى المريخ، قد تحتاج رسالة واحدة حتى <strong>20 دقيقة — في اتجاه واحد فقط</strong>.</p><p>فمَن سيلاحظ؟ ومَن سيقرّر ماذا نفعل — الآن؟ هذا هو السؤال الذي يجيب عنه مشروعنا. نحن فريق [اسم الفريق]، وهذا <strong>OrbitCare</strong>.»</p><p><em>توقّفي ثانيتين بعد السؤال.</em></p>',
        },
    },
    // 2 — NASA's own challenge, answered point by point (relevance)
    {
        layout: 'challenge',
        en: {
            kicker: 'The challenge',
            title: 'NASA asked for software that lets astronauts <span class="accent">understand and act on their own health</span>',

            break;
        case 'challenge':
            body = `<h2>${c.title}</h2><p class="quote">${c.quote}</p>
                <div class="cards is-check">${c.cards.map(([h, p]) => `<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`;
            break;
        case 'stats':
            body = `<h2>${c.title}</h2><div class="stats">${c.stats.map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>
                <p class="hazards">${c.hazards}</p><p class="cite">${c.cite}</p>`;
            break;
        case 'flow':
            body = `<h2>${c.title}</h2><div class="flow" style="grid-template-columns:repeat(${c.steps.length}, 1fr)">${c.steps.map(([icon, h, p], k) => `
                <div class="step"><span class="step-num">${k + 1}</span><span class="icon-box">${svg(icon)}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>${proofHtml(c.proof)}`;
            break;
        case 'feature':
            body = `<h2>${c.title}</h2><p class="why">${c.why}</p>
                <div class="cards">${c.cards.map(([h, p]) => `<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>${proofHtml(c.proof)}`;
            break;
        case 'trust':
            body = `<h2>${c.title}</h2><div class="cards is-6">${c.cards.map(([icon, h, p]) => `
                <div class="card"><span class="icon-box">${svg(icon)}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div>`;
            break;
        case 'demo':
            body = `<h1>${c.title}</h1><ul class="demo-list">${c.list.map((x) => `<li>${x}</li>`).join('')}</ul>
                <a class="open-app" href="../../pages/dashboard.php?lang=${lang}" target="_blank" rel="noopener">${tr('open')}</a>`;
            break;
    }
    const deco = slide.deco === 'orbit' ? '<div class="orbit" aria-hidden="true"></div>'
        : slide.deco === 'star' ? `<div class="big-star" aria-hidden="true">${svg('star')}</div>` : '';
    const kicker = slide.layout === 'demo' ? `<p class="live-dot">${c.kicker}</p>` : `<p class="kicker">${c.kicker}</p>`;
    return `<section class="slide ${slide.cls ?? ''}${i === index ? ' is-active' : ''}" data-slide="${i}" aria-hidden="${i !== index}">${deco}${kicker}${body}</section>`;
}

function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('[data-slides]').innerHTML = SLIDES.map(slideHtml).join('');
    $('[data-lang]').textContent = tr('lang');
    $('[data-notes]').textContent = tr('notes');
    $('[data-full]').textContent = tr('full');
    $('[data-prev]').setAttribute('aria-label', tr('prev'));
    $('[data-next]').setAttribute('aria-label', tr('next'));
    $('[data-notes-title]').textContent = tr('notes_title');
    show(index);
}

function show(i) {
    index = Math.min(SLIDES.length - 1, Math.max(0, i));
    document.querySelectorAll('[data-slide]').forEach((el) => {
        const on = Number(el.dataset.slide) === index;
        el.classList.toggle('is-active', on);
        el.setAttribute('aria-hidden', String(!on));
    });
    $('[data-count]').textContent = `${index + 1} / ${SLIDES.length}`;
    $('[data-progress]').style.width = `${((index + 1) / SLIDES.length) * 100}%`;
    $('[data-notes-body]').innerHTML = SLIDES[index][lang].note;
    $('[data-notes-panel]').scrollTop = 0;
    history.replaceState(null, '', `${location.search}#${index + 1}`);
}

const next = () => show(index + 1);
const prev = () => show(index - 1);
function toggleNotes() { notesOpen = !notesOpen; document.body.classList.toggle('notes-open', notesOpen); $('[data-notes]').setAttribute('aria-pressed', String(notesOpen)); }
function toggleLang() { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('orbitcare-pitch-lang', lang); } catch { /* not remembered */ } render(); }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }

$('[data-next]').addEventListener('click', next);
$('[data-prev]').addEventListener('click', prev);
$('[data-notes]').addEventListener('click', toggleNotes);
$('[data-lang]').addEventListener('click', toggleLang);
$('[data-full]').addEventListener('click', toggleFull);

document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const rtl = lang === 'ar';
    const k = e.key;
    if (k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === (rtl ? 'ArrowLeft' : 'ArrowRight')) { e.preventDefault(); next(); }
    else if (k === 'PageUp' || k === 'ArrowUp' || k === (rtl ? 'ArrowRight' : 'ArrowLeft')) { e.preventDefault(); prev(); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(SLIDES.length - 1);
    else if (k === 'n' || k === 'N') toggleNotes();
    else if (k === 'l' || k === 'L') toggleLang();
    else if (k === 'f' || k === 'F') toggleFull();
});
// a click on the slide (not on a link) goes to the next slide
$('[data-stage]').addEventListener('click', (e) => { if (!e.target.closest('a')) next(); });

// the controls fade out while the mouse rests
let idleTimer;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500); };
document.addEventListener('mousemove', wake);
wake();

// ?print → every slide on its own 1600×900 page; ?print=notes → each slide with its speaker script on an A4 page.
function renderPrint(withNotes) {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.add('print');
    const brand = $('.brand').outerHTML;
    const pages = SLIDES.map((slide, i) => `
        <div class="page ${withNotes ? 'page--notes' : 'page--slide'}">
            <div class="stage">${brand}${slideHtml(slide, i)}</div>
            ${withNotes ? `<div class="page-notes"><h4>${i + 1} / ${SLIDES.length} · ${tr('notes_title')}</h4>${slide[lang].note}</div>` : ''}
        </div>`).join('');
    document.body.insertAdjacentHTML('beforeend', `<div class="print-pages">${pages}</div>`);
    document.querySelectorAll('.print-pages .slide').forEach((el) => { el.classList.add('is-active'); el.removeAttribute('aria-hidden'); });
    const page = document.createElement('style');
    page.textContent = withNotes ? '@page { size: A4 portrait; margin: 0; }' : '@page { size: 1600px 900px; margin: 0; }';
    document.head.append(page);
}

if (params.has('print')) {
    renderPrint(params.get('print') === 'notes');
} else {
    if (params.has('notes')) toggleNotes();
    render();
}
</script>
</body>
</html>
