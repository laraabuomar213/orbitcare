<title>Astronaut Sleep Simulation</title>
<!-- OrbitCare — astronaut sleep simulation (standalone page).
     Layout: Lara's design image — header, five-chapter stepper, one large scene card with a sensor card,
     a single caption, three indicators, and a floating control bar. Everything else lives in "Science details".
     Scene: matte white sculpted crew compartment (her earlier reference), night-blue ambience, glowing sensor dots.
     One simulation engine drives everything; the story is the same on every run (seeded randomness, scripted
     moment where a too-loud pulse wakes the astronaut and the assistant learns his volume).
     Science: OrbitCare team research brief "Sleep waves, lighting & ISS systems" (Nov 2026) + the sources on the page.
     All readings are simulated.
     URL options: ?chapter=before|falling|deep|waking|morning · ?at=HH:MM · ?run · ?speed=10…900 · ?details
                  ?warm=<frames> fast-forward before the first picture (screenshots)
     Works offline: three.js r160 and the fonts are served from this project. -->

<style>

    --font: "Lexend", "IBM Plex Sans Arabic", system-ui, sans-serif;

}

/* header */

.stepper::before, .stepper .fill { content: ""; position: absolute; top: 1rem; inset-inline-start: 10%; height: 2px; background: #dcdcea; }
.stepper::before { inset-inline-end: 10%; }
.stepper .fill { background: var(--lav); width: 0; transition: width 0.4s ease; z-index: 0; }
.step { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.45rem; padding: 0; border: 0; background: none; color: #9a9fb8; font-size: 0.95rem; }

.ind { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-height: 5.2rem; padding: 0.8rem 1rem; border-radius: 16px; background: #fff; border: 1px solid #f0f0f7; }

/* control bar */
.ctrl { display: flex; align-items: center; gap: 1.3rem; width: min(64rem, calc(100% - 2 * var(--gutter))); margin: 4.2rem auto 2rem; padding: 0.75rem 1.4rem 0.75rem 0.75rem; border-radius: 999px; background: #fff; box-shadow: 0 14px 34px rgba(31, 35, 90, 0.12); }

.kv div { padding: 0.5rem; border-radius: 0.7rem; background: #f6f7fb; }

.kv dd { margin: 0.1rem 0 0; font-size: 0.92rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

}

// ================================================================ science details view
const TILES = [{ id: 'hr', key: 't_hr', sub: 'hr_sub' }, { id: 'hrv', key: 't_hrv', sub: 'hrv_sub' }, { id: 'temp', key: 't_temp', sub: 'temp_sub' }, { id: 'move', key: 't_move', sub: 'move_sub' }, { id: 'orient', key: 't_orient', sub: 'orient_sub' }, { id: 'eogact', key: 't_eog', sub: '' }];
function eogLabel() {

}
function currentRule() {

}
function updateDetails() {

    else if (assist.guide) { state = 'guide'; text = tr('st_guide'); }
    else if (reason === 'ok') { state = 'active'; text = tr('st_active'); }
    else if (reason === 'arousal') { state = 'stopped'; text = tr('st_arousal'); }

    document.querySelectorAll('[data-steps] li').forEach((li, i) => li.classList.toggle('on', state === 'active' && det.step === i + 1));

    const L = lightNow;

    const nextT = LIGHT_CHANGES[lightDynamic].find((x) => x > simMin); $('[data-l-next]').textContent = nextT != null ? fmtClock(nextT) : '—';
    $('[data-l-note]').textContent = lightDynamic ? tr('note_dyn') : tr('note_static');
    for (const k of ['delta', 'theta', 'alpha', 'beta']) { const el = document.querySelector(`[data-band="${k}"]`); if (el) { el.style.width = `${Math.round(bands[k] * 100)}%`; document.querySelector(`[data-band-v="${k}"]`).textContent = `${Math.round(bands[k] * 100)}%`; } }
    const set = (id, html) => { const el = document.querySelector(`[data-tv="${id}"]`); if (el) el.innerHTML = html; };
    set('hr', `${Math.round(vit.hr)} <small>${tr('bpm')}</small>`); set('hrv', `${Math.round(vit.rmssd)} <small>${tr('ms')}</small>`); set('temp', `${vit.temp.toFixed(1)} <small>°C</small>`);
    set('move', `${imu.move.toFixed(1)} <small>${tr('degs')}</small>`); set('orient', `<span style="font-size:0.95rem;direction:ltr;unicode-bidi:isolate">↕ ${Math.round(imu.pitch)}° · ↔ ${Math.round(imu.yaw)}°</span>`); set('eogact', `${Math.round(vit.eogAct)} <small>µV</small>`);
    const es = document.querySelector('[data-ts="eogact"]'); if (es) es.textContent = eogLabel();
    const c = (id) => document.querySelector(`[data-tc="${id}"]`);
    if (c('hr')) {
        miniWave(c('hr'), ppgBuf, 4, 1.3, ['#e2557a', '#e2557a']); miniSeries(c('hrv'), night.hrv, '#6f5fd6', 20, 75); miniSeries(c('temp'), night.temp, '#ef8a2e', 33.6, 34.6);
        miniSeries(c('move'), live.move, '#1f9e6a', 0, 40); miniSeries(c('orient'), live.pitch, '#1f9e6a'); miniSeries(c('eogact'), live.eog, '#2f8fd8', 0, 60);
    }

}
const LEVEL = { W: 0, REM: 1, N1: 2, N2: 3, N3: 4 };
function drawHypnogram() {
    const c = $('[data-hypno]'); const { g, W, H } = sizeCanvas(c);
    g.clearRect(0, 0, W, H);
    const left = 46, right = 8, top = 6, lightH = 16, hyTop = top + lightH + 10, hyH = H - hyTop - 34, rowH = hyH / 4;
    const x = (m) => left + (m / END) * (W - left - right);
    g.font = '11px Lexend, "IBM Plex Sans Arabic", sans-serif'; g.fillStyle = '#6b7393'; g.textAlign = 'left';
    g.fillText(tr('light_row'), 2, top + 12);
    g.fillStyle = '#f0f1f7'; g.fillRect(left, top, W - left - right, lightH);
    for (let m = 0; m < Math.min(simMin, END); m += 2) { const L = lightAt(m, lightDynamic), [r, gg, b] = kelvinRGB(L.cct); g.fillStyle = L.b > 0.001 ? `rgba(${r | 0},${gg | 0},${b | 0},${0.2 + 0.8 * Math.sqrt(L.b)})` : '#1b2140'; g.fillRect(x(m), top, x(m + 2) - x(m) + 0.5, lightH); }
    ['W', 'REM', 'N1', 'N2', 'N3'].forEach((s, i) => { const y = hyTop + i * rowH; g.fillStyle = '#6b7393'; g.fillText(s, 2, y + 4); g.strokeStyle = '#eef0f6'; g.beginPath(); g.moveTo(left, y); g.lineTo(W - right, y); g.stroke(); });
    g.lineWidth = 2; let prevY = null;
    for (const s of SEGMENTS) {
        if (s.from >= simMin) break;
        const to = Math.min(simMin, s.to), y = hyTop + LEVEL[s.stage] * rowH;
        g.strokeStyle = STAGE_INFO[s.stage].color; g.beginPath(); if (prevY != null) { g.moveTo(x(s.from), prevY); g.lineTo(x(s.from), y); } else g.moveTo(x(s.from), y); g.lineTo(x(to), y); g.stroke();
        if (s.stage === 'REM') { g.fillStyle = 'rgba(139, 111, 224, 0.35)'; g.fillRect(x(s.from), y - 4, x(to) - x(s.from), 8); }
        prevY = y;
    }
    const sy = hyTop + 4 * rowH + 10;
    g.fillStyle = '#6b7393'; g.fillText(tr('stim_row'), 2, sy + 4); g.fillStyle = '#e2557a';
    for (let m = 0; m < END; m++) if (night.stim[m]) g.fillRect(x(m), sy, Math.max(1.5, x(m + 1) - x(m)), 6);
    g.setLineDash([3, 3]); g.strokeStyle = '#b6bdd6'; g.beginPath(); g.moveTo(x(BED), top); g.lineTo(x(BED), sy + 8); g.stroke(); g.setLineDash([]);
    g.strokeStyle = '#6f5fd6'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x(simMin), top); g.lineTo(x(simMin), sy + 8); g.stroke();
    g.fillStyle = '#6b7393'; g.textAlign = 'center'; for (let m = 30; m <= END; m += 120) g.fillText(fmtClock(m), x(m), H - 4);
}

// ================================================================ texts & controls
function renderTexts() {

    document.title = tr('title');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = tr(el.dataset.i18n); });
    $('[data-lang] span').textContent = tr('lang');
    $('[data-veil-start] span').textContent = tr('start');
    const stepper = $('[data-stepper]');
    stepper.querySelectorAll('.step').forEach((el) => el.remove());
    CHAPTERS.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'step'; b.dataset.chapter = c.id; b.innerHTML = `<i></i><span>${esc(tr('chapters')[i])}</span>`; stepper.append(b); });
    $('[data-steps]').innerHTML = tr('stim_steps').map((s) => `<li>${esc(s)}</li>`).join('');
    $('[data-rules]').innerHTML = tr('rules').map(([id, when, what]) => `<li data-rule="${id}"><b>${esc(when)}</b><span>${esc(what)}</span></li>`).join('');
    $('[data-eeg-legend]').innerHTML = `<span><i style="background:#3b3f8f"></i>EEG</span><span><i style="background:repeating-linear-gradient(90deg,#2f5fd8 0 4px,transparent 4px 7px)"></i>${esc(tr('eeg_leg_thr'))} (${THR} µV)</span><span><i style="background:#2f5fd8;width:0.5rem;height:0.5rem;border-radius:50%"></i>${esc(tr('eeg_leg_trough'))}</span><span><i style="background:#e2557a;width:0.2rem;height:0.8rem"></i>${esc(tr('eeg_leg_pulse'))}</span>`;
    $('[data-bands]').innerHTML = [['delta', '0.5–4 Hz', '#2b3a8f'], ['theta', '4–8 Hz', '#4f7fd6'], ['alpha', '8–13 Hz', '#8b6fe0'], ['beta', '13–30 Hz', '#e2557a']]
        .map(([k, hz, c]) => `<div class="band"><span><b>${esc(tr(`b_${k}`))}</b><small>${hz}</small></span><div class="bar"><i data-band="${k}" style="background:${c};width:25%"></i></div><output data-band-v="${k}">—</output></div>`).join('');
    $('[data-tiles]').innerHTML = TILES.map((t) => `<div class="tile"><h4>${esc(tr(t.key))}</h4><div class="val" data-tv="${t.id}">—</div><div class="sub" data-ts="${t.id}">${t.sub ? esc(tr(t.sub)) : ''}</div><canvas data-tc="${t.id}"></canvas></div>`).join('');
    $('[data-sensors]').innerHTML = SENSORS.map((s) => `<div class="sensor"><h4><i style="background:${s.color}"></i>${esc(s.title[lang])}<span class="tag-sim" style="background:var(--lav-soft);color:var(--lav)">${esc(tr(`role_${s.role}`))}</span></h4><dl>${[['what', 'what'], ['where_l', 'where'], ['why_l', 'why']].map(([lk, k]) => `<div><dt>${esc(tr(lk))}</dt><dd>${esc(s.full[k][lang])}</dd></div>`).join('')}</dl></div>`).join('');
    $('[data-science]').innerHTML = SCIENCE.map((s) => `<li>${s[lang]}</li>`).join('');
    $('[data-sources]').innerHTML = `${esc(tr('sources'))} ` + SOURCES.map(([url, name]) => `<a href="${url}" target="_blank" rel="noopener">${esc(name[lang])}</a>`).join(' · ');
    renderCard(); updateMain(); updateDetails();
}
const PLAY_ICON = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.2" fill="currentColor"/></svg>';
function updateButtons() {
    const play = $('[data-play]');
    if (play.dataset.state !== String(running)) { play.dataset.state = String(running); play.innerHTML = running ? PAUSE_ICON : PLAY_ICON; play.setAttribute('aria-label', running ? 'pause' : 'play'); }
    $('[data-speed-label]').textContent = tr('speed', { n: speed });
    $('[data-veil]').hidden = started;
    const sb = $('[data-stim-toggle]'); sb.textContent = tr(stimEnabled ? 'stim_on' : 'stim_off'); sb.setAttribute('aria-pressed', String(stimEnabled));
    const lb = $('[data-light-toggle]'); lb.textContent = tr(lightDynamic ? 'light_on' : 'light_off'); lb.setAttribute('aria-pressed', String(lightDynamic));
    const hb = $('[data-hear]'); hb.textContent = tr('hear'); hb.setAttribute('aria-pressed', String(hearPulses));
}
const arousalDone = new Set();
function resetEngine(at) {
    seed = 20261114 + Math.round(at * 7);
    simMin = at; finished = false; lastMinute = Math.floor(at) - 1;
    Object.assign(det, { state: 'idle', step: 0, count: 0, response: null, lastAmp: null });
    markers.length = 0;
    Object.assign(assist, { guide: false, vol: 3, quiet: 0, best: 0, bad: null, cap: VOL_MAX, stimWakes: 0, natWakes: 0, lastWake: null, learnedAt: -1e9 });
    G.arousalUntil = -1;
    night.hr.fill(null); night.hrv.fill(null); night.temp.fill(null); night.stim.fill(0);
    arousalDone.clear(); for (const a of AROUSALS) if (a < at) arousalDone.add(a);
    chapterSeen = new Set();
    modeNow = modeAt(simMin);
    Object.assign(w, TARGETS[modeNow]);   // start the brain in the right state, no slow fade-in
}
function jumpTo(id) {
    const ch = CHAPTERS.find((c) => c.id === id); if (!ch) return;
    resetEngine(ch.at);
    if (ch.vol) assist.vol = ch.vol;
    if (ch.quiet) assist.quiet = ch.quiet;
    if (id === 'waking') assist.best = ch.vol;
    started = true; running = true;
    updateMain(); updateDetails();
}
function startOrToggle() {
    if (finished) { resetEngine(0); }

    updateButtons();
}
$('[data-stepper]').addEventListener('click', (e) => { const b = e.target.closest('[data-chapter]'); if (b) jumpTo(b.dataset.chapter); });
$('[data-play]').addEventListener('click', startOrToggle);
$('[data-veil-start]').addEventListener('click', startOrToggle);
$('[data-reset]').addEventListener('click', () => { resetEngine(0); started = true; running = true; updateMain(); });
const speedRange = $('[data-speed-range]');
speedRange.value = String(speedToSlider(speed));
speedRange.addEventListener('input', () => { speed = sliderToSpeed(Number(speedRange.value)); updateButtons(); });
$('[data-stim-toggle]').addEventListener('click', () => { stimEnabled = !stimEnabled; updateButtons(); });
$('[data-light-toggle]').addEventListener('click', () => { lightDynamic = !lightDynamic; updateButtons(); });
$('[data-hear]').addEventListener('click', () => { hearPulses = !hearPulses; if (hearPulses) { ensureAudio(); audioCtx.resume?.(); } updateButtons(); });
function showDetails(on) {
    detailsOpen = on;
    $('[data-view-main]').hidden = on; $('[data-view-details]').hidden = !on;
    window.scrollTo(0, 0);
    if (on) updateDetails(); else resize();
}
$('[data-details-open]').addEventListener('click', () => showDetails(true));
$('[data-details-close]').addEventListener('click', () => showDetails(false));
$('[data-lang]').addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('orbitcare-sleep-lang', lang); } catch { /* language just isn't remembered */ }
    renderTexts();
});

// ================================================================ main loop
function resize() { const { clientWidth: wd, clientHeight: h } = stage; if (!wd || !h) return; renderer.setSize(wd, h, false); camera.aspect = wd / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
resize();

let acc = 0;
function advancePhysiology(dt) {
    modeNow = modeAt(simMin);
    for (const a of AROUSALS) if (simMin >= a && !arousalDone.has(a) && simMin < a + 30) { arousalDone.add(a); startArousal(false); }
    assist.guide = stimEnabled && (modeNow === 'winddown' || modeNow === 'relaxed') && bands.beta >= 0.08;
    const [hr, rmssd, br] = VITALS[modeNow], k = 1 - Math.exp(-dt / 2);
    heart.hr += (hr + (tReal < G.arousalUntil ? 14 : 0) - heart.hr) * k; heart.rmssd += (rmssd - heart.rmssd) * k;
    breathRate += ((assist.guide ? 6 : br) - breathRate) * k;
    acc += dt * FS;
    while (acc >= 1) { stepSample(); acc -= 1; }
}
modeNow = modeAt(simMin);
Object.assign(w, TARGETS[modeNow]);
for (let i = 0; i < FS * 8; i++) stepSample();
updateBands(); computeVitals();

function updateGlows(now) {
    const latest = (buf) => buf[((n - 1) % BUF + BUF) % BUF];
    const level = {
        eeg: 0.4 + 0.6 * Math.min(1, Math.abs(latest(eegBuf)) / 90), eog: 0.35 + 0.65 * Math.min(1, Math.abs(latest(eogBuf)) / 120),
        ppg: 0.3 + 0.7 * Math.min(1, latest(ppgBuf)), imu: 0.4 + 0.6 * Math.min(1, imu.move / 15), temp: 0.8,
        audio: Math.max(assist.guide ? 0.55 + 0.4 * Math.sin(G.ph.resp) : 0.35, now - pulseFlash < 250 ? 1.2 : 0),
    };
    for (const [id, meshes] of Object.entries(glowsBy)) for (const m of meshes) m.material.color.copy(m.userData.base).multiplyScalar(level[id] * (id === selected && cardOpen ? 1.3 : 1));
    const pulse = reduceMotion ? 0.4 : 0.25 + 0.3 * (0.5 + 0.5 * Math.sin(now / 280));
    for (const [id, meshes] of Object.entries(podsBy)) for (const m of meshes) { m.material.emissive.set(SENSOR_COLOR[id]); m.material.emissiveIntensity = id === selected && cardOpen ? pulse : 0; }
    for (const r of pulseRings) { const age = (now - pulseFlash) / 1000; r.material.opacity = age < 0.6 ? 0.9 * (1 - age / 0.6) : 0; r.scale.setScalar(1 + age * 2.2); }
}
const ease = (f) => 1 - (1 - f) ** 3;
let bandT = 0, panelT = 0, liveT = 0, last = performance.now();
function tick(dt, now) {
    if (running) {
        simMin = Math.min(END, simMin + dt * speed / 60);
        advancePhysiology(dt); updateBody(dt, tReal); updateAir(dt);
        if (simMin >= END) { running = false; finished = true; }
        const mNow = Math.floor(Math.min(simMin, END - 1));
        computeVitals();
        const ok = stimEligibility() === 'ok';
        for (let m = lastMinute + 1; m <= mNow; m++) { night.hr[m] = vit.hr; night.hrv[m] = vit.rmssd; night.temp[m] = vit.temp; if (ok) night.stim[m] = 1; }
        if (mNow > lastMinute) lastMinute = mNow;
        if (ok) night.stim[mNow] = 1;
        bandT += dt; if (bandT > 0.25) { bandT = 0; updateBands(); }
        liveT += dt; if (liveT > 0.25) { liveT = 0; live.move.push(imu.move); live.eog.push(vit.eogAct); live.pitch.push(imu.pitch); for (const key in live) if (live[key].length > 120) live[key].shift(); }
    } else if (!started) { modeNow = modeAt(simMin); updateBody(0, tReal); }
    applyLight(dt);
    updateGlows(now);
    if (turn) { const f = Math.min(1, (now - turn.start) / turn.ms); camera.position.lerpVectors(turn.fromPos, turn.toPos, ease(f)); controls.target.lerpVectors(turn.fromTarget, turn.toTarget, ease(f)); if (f >= 1) turn = null; }
}
function draw(dt) {
    if (!detailsOpen) {
        controls.update(); renderer.render(scene, camera); placeLeader();
        miniWave($('[data-ind-waves]'), eegBuf, 3, 130, ['#e2557a', '#c45be0'], true);
        drawCardWave();
    } else {
        drawTrace($('[data-eeg]'), eegBuf, 150, { threshold: THR, markers: true, color: '#3b3f8f', bar: 100 });
        drawTrace($('[data-eog]'), eogBuf, 250, { color: '#2f8fd8', bar: 200 });
    }
    panelT += dt; if (panelT > 0.2) { panelT = 0; if (detailsOpen) updateDetails(); updateMain(); }
}
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; tick(dt, now); draw(dt); requestAnimationFrame(frame); }

applyLight(); updateBody(0, 0); renderTexts();
if (params.get('chapter')) jumpTo(params.get('chapter'));
else if (params.has('run')) startOrToggle();
if (params.has('details')) showDetails(true);
for (let i = 0, warm = Math.min(20000, Number(params.get('warm')) || 0); i < warm; i++) tick(1 / 60, performance.now());
draw(1); updateMain();
requestAnimationFrame(frame);
