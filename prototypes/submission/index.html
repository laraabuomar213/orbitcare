<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbitCare Submission</title>
<!-- OrbitCare — official 7-slide submission deck for NASA Space Apps 2026 (English, with an Arabic reading version).
     Built around three things: the problem, the solution, and the source. Every fact shows its source in full.
     1 title · 2 six risks · 3 the gap + our answer · 4 how it works · 5 problem → solution · 6 the prototype · 7 impact.
     Status tags: Prototype (works in our website) · Design concept (specified, not built) · Research direction (not tested in space).
     Keys: → / ← / Space / PageDown / PageUp · L language · F full screen. ?lang=ar|en · ?print → one slide per PDF page.
     Screenshots: shots/*.png (real pages of the prototype, temporary demo accounts). Works offline. -->
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
:root {
    --space: #0b1130; --navy: #1a2250; --ink: #f4f6ff; --soft: #bcc5e8; --muted: #8a95c2;
    --accent: #5b8cff; --accent-2: #8fb0ff; --warm: #ffb547; --warm-2: #ffd08a; --green: #4fd1a1;
    --line: rgba(185, 194, 230, 0.16); --card: rgba(255, 255, 255, 0.05);
    --font: "Lexend", "IBM Plex Sans Arabic", system-ui, sans-serif;
}
[lang="ar"] { --font: "IBM Plex Sans Arabic", "Lexend", system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { overflow: hidden; background: #060a1c; color: var(--ink); font-family: var(--font); }
button, a { font: inherit; }
bdi { unicode-bidi: isolate; }

.viewport { position: fixed; inset: 0; display: grid; place-items: center; }
.stage {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; container-type: size;
    background:
        radial-gradient(1.2px 1.2px at 12% 18%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 78% 9%, #fff6 50%, transparent 51%),
        radial-gradient(1.3px 1.3px at 64% 76%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 30% 88%, #fff5 50%, transparent 51%),
        radial-gradient(1.1px 1.1px at 92% 58%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 47% 6%, #fff5 50%, transparent 51%),
        radial-gradient(ellipse 70% 60% at 88% 112%, rgba(91, 140, 255, 0.2), transparent 70%),
        radial-gradient(ellipse 60% 50% at 0% -12%, rgba(143, 176, 255, 0.1), transparent 70%),
        linear-gradient(160deg, var(--navy) 0%, var(--space) 72%);
}
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 6cqh 5cqw 4.5cqh; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s; }
.slide.is-active { opacity: 1; visibility: visible; transition: opacity 0.4s ease; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2cqw; }
.kicker { display: flex; align-items: center; gap: 0.8cqw; font-size: 1.15cqw; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); }
[lang="ar"] .kicker { letter-spacing: 0; font-size: 1.4cqw; text-transform: none; }
.kicker .n { display: inline-grid; place-items: center; width: 2.1cqw; height: 2.1cqw; border-radius: 50%; border: 1px solid var(--accent-2); font-size: 1cqw; letter-spacing: 0; }
h2 { margin-top: 1cqh; font-size: 2.8cqw; font-weight: 600; line-height: 1.15; text-wrap: balance; }
[lang="ar"] h2 { font-size: 2.6cqw; line-height: 1.35; }
.brand { display: flex; align-items: center; gap: 0.5cqw; flex: none; font-size: 1.15cqw; font-weight: 600; color: var(--soft); }
.brand svg { width: 1.4cqw; height: 1.4cqw; color: var(--accent); }
.foot { margin-top: auto; padding-top: 1.6cqh; display: flex; align-items: flex-end; justify-content: space-between; gap: 2cqw; }
.foot > span:last-child { flex: none; direction: ltr; unicode-bidi: isolate; font-size: 0.9cqw; color: var(--muted); }
.accent { color: var(--accent-2); }
.card { border: 1px solid var(--line); border-radius: 1.2cqw; background: var(--card); }
.ico { display: grid; place-items: center; flex: none; width: 3.2cqw; height: 3.2cqw; border-radius: 0.9cqw; background: rgba(91, 140, 255, 0.15); color: var(--accent-2); }
.ico svg { width: 1.9cqw; height: 1.9cqw; }
.slide p.src-line { display: flex; gap: 0.5cqw; font-size: 0.88cqw; line-height: 1.45; color: var(--muted); }
.slide .pair p.src-line { font-size: 0.8cqw; }
.src-line::before { content: "↗"; color: var(--accent-2); }
[dir="rtl"] .src-line::before { content: "↖"; }

.tag { display: inline-flex; align-items: center; gap: 0.4cqw; padding: 0.35cqh 0.7cqw; border-radius: 999px; font-size: 0.85cqw; font-weight: 600; white-space: nowrap; }
.tag::before { content: ""; width: 0.55cqw; height: 0.55cqw; border-radius: 50%; background: currentColor; }
.tag.p { background: rgba(79, 209, 161, 0.13); color: var(--green); }
.tag.c { background: rgba(143, 176, 255, 0.14); color: var(--accent-2); }
.tag.r { background: rgba(255, 181, 71, 0.14); color: var(--warm); }
.legend { display: flex; flex-wrap: wrap; gap: 0.6cqw 1cqw; }

/* 1 · title */
.s-title { justify-content: center; padding-inline: 6cqw; }
.s-title .kicker { color: var(--warm); }
.wordmark { display: flex; align-items: center; gap: 1.6cqw; margin-top: 2.6cqh; font-size: 8.4cqw; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.wordmark svg { width: 6.2cqw; height: 6.2cqw; color: var(--accent); filter: drop-shadow(0 0 2.2cqw rgba(91, 140, 255, 0.55)); }
.tagline { margin-top: 3.4cqh; max-width: 54cqw; font-size: 2.15cqw; font-weight: 500; line-height: 1.35; }
.context { margin-top: 2.4cqh; max-width: 48cqw; font-size: 1.3cqw; line-height: 1.55; color: var(--soft); }
.team { position: absolute; bottom: 5cqh; inset-inline-start: 6cqw; font-size: 1.1cqw; color: var(--muted); }
.team b { color: var(--ink); font-weight: 600; }
.trajectory { position: absolute; inset-inline-end: 3cqw; top: 8cqh; width: 40cqw; height: 84cqh; }

/* 2 · risks */
.risks { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 1.3cqw; margin-top: 3cqh; flex: 1; min-height: 0; }
.risk { display: flex; flex-direction: column; padding: 2.4cqh 1.6cqw; }
.risk h3 { display: flex; align-items: center; gap: 0.9cqw; font-size: 1.5cqw; font-weight: 600; }
.risk b { margin-top: 1.8cqh; font-size: 3.4cqw; font-weight: 600; line-height: 1; color: var(--warm); }
.risk p { margin-top: 1.2cqh; font-size: 1.25cqw; line-height: 1.5; color: var(--soft); }
.risk .src-line { margin-top: auto; padding-top: 1.4cqh; }

/* 3 · gap + answer */
.gap { display: grid; grid-template-columns: 1fr 1.1fr; gap: 2cqw; margin-top: 3cqh; flex: 1; min-height: 0; }
.col-title { font-size: 1.05cqw; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--warm); }
[lang="ar"] .col-title { letter-spacing: 0; font-size: 1.3cqw; }
.col-title.blue { color: var(--accent-2); }
.reasons { display: grid; gap: 1.2cqw; margin-top: 1.6cqh; padding: 0; list-style: none; counter-reset: r; }
.reasons li { display: grid; grid-template-columns: 3cqw 1fr; gap: 1.1cqw; padding: 2.2cqh 1.5cqw; counter-increment: r; }
.reasons li::before { content: counter(r); display: grid; place-items: center; width: 3cqw; height: 3cqw; border-radius: 50%; background: rgba(255, 181, 71, 0.15); color: var(--warm); font-size: 1.3cqw; font-weight: 600; }
.reasons h3 { font-size: 1.45cqw; font-weight: 600; }
.reasons p { margin-top: 0.6cqh; font-size: 1.2cqw; line-height: 1.5; color: var(--soft); }
.reasons .src-line { margin-top: 0.8cqh; }
.answer { display: flex; flex-direction: column; padding: 2.8cqh 2cqw; border-color: rgba(91, 140, 255, 0.5); background: linear-gradient(180deg, rgba(91, 140, 255, 0.13), rgba(91, 140, 255, 0.03)); }
.answer .big { margin-top: 1.4cqh; font-size: 1.9cqw; font-weight: 500; line-height: 1.4; }
.loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8cqw; margin-top: 3cqh; }
.loop .node { position: relative; padding: 2.8cqh 1cqw; border-radius: 1cqw; background: rgba(6, 10, 28, 0.45); text-align: center; }
.loop .node i { display: grid; place-items: center; width: 2.6cqw; height: 2.6cqw; margin: 0 auto 1.4cqh; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-size: 1.15cqw; font-weight: 600; }
.loop .node b { display: block; font-size: 1.45cqw; font-weight: 600; }
.loop .node span { display: block; margin-top: 0.8cqh; font-size: 1.08cqw; line-height: 1.4; color: var(--soft); }
.loop-back { margin-top: 1.4cqh; font-size: 1.1cqw; color: var(--warm-2); text-align: center; }
.not { margin-top: auto; padding-top: 2cqh; font-size: 1.15cqw; line-height: 1.5; color: var(--soft); }
.not b { color: var(--ink); font-weight: 600; }

/* 4 · how it works */
.flow { display: grid; grid-template-columns: 1fr auto 1.15fr auto 1fr; gap: 1.2cqw; align-items: stretch; margin-top: 3cqh; flex: 1; min-height: 0; }
.fcol { display: flex; flex-direction: column; }
.fcol .col-title { margin-bottom: 1.4cqh; color: var(--muted); }
.list { display: grid; gap: 1cqw; flex: 1; grid-auto-rows: 1fr; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 1cqw; padding: 1.6cqh 1.3cqw; }
.list h4 { font-size: 1.3cqw; font-weight: 600; }
.list p { margin-top: 0.4cqh; font-size: 1.02cqw; line-height: 1.45; color: var(--soft); }
.arrow { align-self: center; color: var(--accent); }
.arrow svg { width: 2.2cqw; height: 2.2cqw; }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }
.core { display: flex; flex-direction: column; padding: 2.2cqh 1.6cqw; border: 1px solid rgba(91, 140, 255, 0.5); border-radius: 1.2cqw; background: linear-gradient(180deg, rgba(91, 140, 255, 0.14), rgba(91, 140, 255, 0.04)); }
.core-name { display: flex; align-items: center; gap: 0.6cqw; font-size: 1.6cqw; font-weight: 600; }
.core-name svg { width: 1.6cqw; height: 1.6cqw; color: var(--accent); }
.core-sub { margin-top: 0.5cqh; font-size: 1cqw; color: var(--soft); }
.pipe { display: grid; gap: 0.8cqw; margin-top: 2cqh; flex: 1; grid-auto-rows: 1fr; padding: 0; list-style: none; counter-reset: s; }
.pipe li { display: flex; align-items: center; gap: 1cqw; padding: 1.2cqh 1.2cqw; border-radius: 0.9cqw; background: rgba(6, 10, 28, 0.45); counter-increment: s; }
.pipe li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 2cqw; height: 2cqw; border-radius: 50%; background: var(--accent); color: #fff; font-size: 0.95cqw; font-weight: 600; }
.pipe b { display: block; font-size: 1.25cqw; font-weight: 600; }
.pipe span { display: block; margin-top: 0.3cqh; font-size: 0.98cqw; line-height: 1.4; color: var(--soft); }
.data-note { margin-top: 1.8cqh; padding: 1.3cqh 1.5cqw; border-radius: 1cqw; background: var(--card); font-size: 1.05cqw; line-height: 1.5; color: var(--soft); }
.data-note b { color: var(--ink); font-weight: 600; }

/* 5 · problem → solution */
.pairs { display: grid; gap: 0.85cqw; margin-top: 2.6cqh; padding: 0; list-style: none; flex: 1; grid-auto-rows: 1fr; min-height: 0; }
.pair { display: grid; grid-template-columns: 1fr 2.4cqw 1.35fr; align-items: center; }
.pair .prob { align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 1cqh 1.3cqw; border: 1px solid rgba(255, 181, 71, 0.25); border-radius: 1cqw; background: rgba(255, 181, 71, 0.05); }
.pair .prob b { font-size: 1.15cqw; font-weight: 600; color: var(--warm-2); }
.pair .prob .src-line { margin-top: 0.4cqh; font-size: 0.8cqw; }
.pair .to { justify-self: center; color: var(--accent); }
.pair .to svg { width: 1.6cqw; height: 1.6cqw; }
[dir="rtl"] .pair .to svg { transform: scaleX(-1); }
.pair .sol { align-self: stretch; display: flex; align-items: center; gap: 1cqw; padding: 1cqh 1.3cqw; border: 1px solid rgba(91, 140, 255, 0.35); border-radius: 1cqw; background: rgba(91, 140, 255, 0.07); }
.pair .sol .ico { width: 2.6cqw; height: 2.6cqw; }
.pair .sol .ico svg { width: 1.5cqw; height: 1.5cqw; }
.pair .sol h4 { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3cqh 0.7cqw; font-size: 1.15cqw; font-weight: 600; }
.pair .sol p { margin-top: 0.3cqh; font-size: 0.95cqw; line-height: 1.42; color: var(--soft); }
.pairs-head { display: grid; grid-template-columns: 1fr 2.4cqw 1.35fr; margin-top: 2.4cqh; font-size: 1cqw; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
[lang="ar"] .pairs-head { letter-spacing: 0; font-size: 1.25cqw; }
.pairs-head span:first-child { color: var(--warm); }
.pairs-head span:last-child { grid-column: 3; color: var(--accent-2); }
.pairs-head + .pairs { margin-top: 1cqh; }

/* 6 · prototype */
.shots { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 1.2cqw; margin-top: 2.6cqh; flex: 1; min-height: 0; }
.shot { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 1cqw; background: #0a1030; }
.shot img { flex: 1; min-height: 0; width: 100%; object-fit: cover; object-position: top center; display: block; }
.shot .ph { flex: 1; display: grid; place-items: center; font-size: 1cqw; color: var(--muted); }
.shot figcaption { padding: 1cqh 1.1cqw; background: rgba(255, 255, 255, 0.05); }
.shot figcaption b { display: block; font-size: 1.12cqw; font-weight: 600; }
.shot figcaption span { display: block; margin-top: 0.2cqh; font-size: 0.92cqw; line-height: 1.4; color: var(--soft); }
.why-sim { margin-top: 1.8cqh; padding: 1.3cqh 1.5cqw; border: 1px solid rgba(255, 181, 71, 0.28); border-radius: 1cqw; background: rgba(255, 181, 71, 0.05); font-size: 1.1cqw; line-height: 1.5; }
.why-sim b { color: var(--warm-2); font-weight: 600; }

/* 7 · impact */
.impact { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3cqw; margin-top: 3cqh; }
.impact .card { padding: 2.4cqh 1.6cqw; }
.impact h3 { display: flex; align-items: center; gap: 0.9cqw; font-size: 1.5cqw; font-weight: 600; }
.impact p { margin-top: 1.2cqh; font-size: 1.2cqw; line-height: 1.5; color: var(--soft); }
.road { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3cqw; margin-top: 2.4cqh; }
.step { padding: 2cqh 1.6cqw; border-top: 0.35cqh solid; border-radius: 0 0 1cqw 1cqw; background: var(--card); }
.step .when { font-size: 1cqw; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
[lang="ar"] .step .when { letter-spacing: 0; font-size: 1.2cqw; }
.step p { margin-top: 0.8cqh; font-size: 1.15cqw; line-height: 1.5; color: var(--soft); }
.step.now { border-color: var(--green); } .step.now .when { color: var(--green); }
.step.next { border-color: var(--accent-2); } .step.next .when { color: var(--accent-2); }
.step.later { border-color: var(--warm); } .step.later .when { color: var(--warm); }
.vision { margin-top: 4cqh; display: flex; align-items: center; gap: 1.4cqw; }
.refs { margin-top: auto; padding-top: 1.8cqh; border-top: 1px solid var(--line); }
.refs h4 { font-size: 0.95cqw; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
[lang="ar"] .refs h4 { letter-spacing: 0; font-size: 1.15cqw; }
.refs ol { columns: 2; column-gap: 3cqw; margin-top: 1cqh; padding-inline-start: 1.6cqw; font-size: 0.88cqw; line-height: 1.55; color: var(--soft); }
.refs li { break-inside: avoid; }
.refs li::marker { color: var(--accent-2); }
.vision svg { width: 3.4cqw; height: 3.4cqw; flex: none; color: var(--accent); filter: drop-shadow(0 0 1.4cqw rgba(91, 140, 255, 0.6)); }
.vision p { font-size: 2.1cqw; font-weight: 500; line-height: 1.3; }

/* controls */
.progress { position: absolute; left: 0; bottom: 0; height: 0.45cqh; background: var(--accent); transition: width 0.4s ease; }
[dir="rtl"] .progress { left: auto; right: 0; }
.controls { position: fixed; bottom: 1rem; inset-inline-end: 1rem; z-index: 5; display: flex; align-items: center; gap: 0.35rem; padding: 0.35rem; border-radius: 999px; background: rgba(12, 18, 48, 0.85); border: 1px solid var(--line); transition: opacity 0.3s ease; }
body.idle .controls { opacity: 0; }
.ctrl { min-width: 2.4rem; height: 2.4rem; padding: 0 0.8rem; border: 0; border-radius: 999px; background: transparent; color: var(--soft); font-size: 0.85rem; cursor: pointer; }
.ctrl:hover { background: rgba(91, 140, 255, 0.2); color: #fff; }
.ctrl svg { width: 1.1rem; height: 1.1rem; vertical-align: middle; }
[dir="rtl"] .ctrl[data-prev] svg, [dir="rtl"] .ctrl[data-next] svg { transform: scaleX(-1); }
.count { direction: ltr; unicode-bidi: isolate; min-width: 3rem; text-align: center; font-size: 0.85rem; color: var(--soft); }

/* ?print → one 1600×900 page per slide (PDF export) */
body.print { overflow: visible; height: auto; }
body.print .viewport, body.print .controls { display: none; }
.print-pages .page { width: 1600px; height: 900px; overflow: hidden; break-after: page; }
.print-pages .page:last-child { break-after: auto; }
.print-pages .stage { width: 100%; }
.print-pages .slide { opacity: 1; visibility: visible; transition: none; }
@media print { * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
@media (prefers-reduced-motion: reduce) { .slide, .progress { transition: none; } }
</style>
</head>
<body>
<div class="viewport"><main class="stage" data-stage><div data-slides></div><div class="progress" data-progress></div></main></div>
<nav class="controls" aria-label="Slides">
    <button class="ctrl" type="button" data-prev aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="count" data-count></span>
    <button class="ctrl" type="button" data-next aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ctrl" type="button" data-lang></button>
    <button class="ctrl" type="button" data-full></button>
</nav>

<script>
// ---------------------------------------------------------------- icons
const P = {

const tag = (k) => `<span class="tag ${k}">${t().tags[TAG_I[k]]}</span>`;
const legend = () => `<div class="legend">${['p', 'c', 'r'].map((k, i) => `<span class="tag ${k}">${t().legend[i]}</span>`).join('')}</div>`;
const head = (n, s) => `<div class="head"><div><p class="kicker"><span class="n">${n}</span>${s.kicker}</p><h2>${s.title}</h2></div>${brand}</div>`;
const foot = (n, left = '') => `<div class="foot">${left || '<span></span>'}<span>${n} / 7</span></div>`;

function slide1() {
    const s = t().s1;
    return `<section class="slide s-title">
        <svg class="trajectory" viewBox="0 0 400 520" aria-hidden="true">
            <defs><radialGradient id="g-earth" cx="35%" cy="35%"><stop offset="0" stop-color="#9cc3ff"/><stop offset="1" stop-color="#2f5fd8"/></radialGradient>
            <radialGradient id="g-mars" cx="35%" cy="35%"><stop offset="0" stop-color="#ffc58a"/><stop offset="1" stop-color="#c8562d"/></radialGradient></defs>
            <circle cx="300" cy="260" r="215" fill="none" stroke="rgba(143,176,255,0.14)"/>
            <circle cx="300" cy="260" r="150" fill="none" stroke="rgba(143,176,255,0.1)" stroke-dasharray="3 6"/>
            <path d="M118 400 C 150 240, 230 140, 340 92" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="7 7" opacity="0.85"/>
            <circle cx="96" cy="420" r="34" fill="url(#g-earth)"/><circle cx="96" cy="420" r="44" fill="none" stroke="rgba(143,176,255,0.35)"/>
            <circle cx="356" cy="82" r="22" fill="url(#g-mars)"/>
            <circle cx="214" cy="190" r="6" fill="#fff"/><circle cx="214" cy="190" r="14" fill="none" stroke="rgba(255,255,255,0.35)"/>
            <text x="96" y="490" fill="#b7c0e4" font-size="17" text-anchor="middle" font-family="inherit">${s.earth}</text>
            <text x="356" y="134" fill="#b7c0e4" font-size="17" text-anchor="middle" font-family="inherit">${s.mars}</text>
            <text x="236" y="272" fill="#ffd08a" font-size="15" font-family="inherit">${s.delay}</text>
        </svg>
        <p class="kicker">${s.kicker}</p>
        <div class="wordmark">${svg('star')}OrbitCare</div>
        <p class="tagline">${s.tagline}</p>
        <p class="context">${s.context}</p>
        <p class="team">${s.team} · <b>${s.teamName}</b></p>
    </section>`;
}

function slide2() {
    const s = t().s2;
    return `<section class="slide">${head(2, s)}
        <div class="risks">${s.risks.map(([i, h, n, p, k]) => `<div class="card risk"><h3>${ico(i)}${h}</h3>${n ? `<b>${n}</b>` : ''}<p>${p}</p>${src(k)}</div>`).join('')}</div>
        ${foot(2)}</section>`;
}

function slide3() {
    const s = t().s3;
    return `<section class="slide">${head(3, s)}
        <div class="gap">
            <div><p class="col-title">${s.gapT}</p>
                <ol class="reasons">${s.gap.map(([h, p, k]) => `<li class="card"><div><h3>${h}</h3><p>${p}</p>${k ? src(k) : ''}</div></li>`).join('')}</ol></div>
            <div class="card answer"><p class="col-title blue">${s.ansT}</p>
                <p class="big">${s.big}</p>
                <div class="loop">${s.loop.map(([h, p], i) => `<div class="node"><i>${i + 1}</i><b>${h}</b><span>${p}</span></div>`).join('')}</div>
                <p class="loop-back">${s.loopBack}</p>
                <p class="not">${s.not}</p></div>
        </div>
        ${foot(3)}</section>`;
}

function slide4() {
    const s = t().s4;
    const arrow = `<span class="arrow">${svg('arrow')}</span>`;
    return `<section class="slide">${head(4, s)}
        <div class="flow">
            <div class="fcol"><p class="col-title">${s.c1}</p><ul class="list">${s.src.map(([i, h, p]) => `<li class="card">${ico(i)}<div><h4>${h}</h4><p>${p}</p></div></li>`).join('')}</ul></div>
            ${arrow}
            <div class="fcol"><p class="col-title">${s.c2}</p><div class="core"><p class="core-name">${svg('star')}OrbitCare</p><p class="core-sub">${s.core}</p>
                <ol class="pipe">${s.pipe.map(([h, p]) => `<li><div><b>${h}</b><span>${p}</span></div></li>`).join('')}</ol></div></div>
            ${arrow}
            <div class="fcol"><p class="col-title">${s.c3}</p><ul class="list">${s.out.map(([i, h, p]) => `<li class="card">${ico(i)}<div><h4>${h}</h4><p>${p}</p></div></li>`).join('')}</ul></div>
        </div>
        <p class="data-note">${s.note}</p>
        ${foot(4, src('physio'))}</section>`;
}

function slide5() {
    const s = t().s5;
    return `<section class="slide">${head(5, s)}
        <div class="pairs-head"><span>${s.hProb}</span><span>${s.hSol}</span></div>
        <ul class="pairs">${s.pairs.map(([prob, k, i, name, st, how]) => `
            <li class="pair"><div class="prob"><b>${prob}</b>${src(k)}</div><span class="to">${svg('arrow')}</span>
                <div class="sol">${ico(i)}<div><h4>${name} ${tag(st)}</h4><p>${how}</p></div></div></li>`).join('')}</ul>
        ${foot(5, `<div>${legend()}<div style="margin-top:0.8cqh">${src(s.sleepSrc)}</div></div>`)}</section>`;
}

function slide6() {
    const s = t().s6;
    return `<section class="slide">${head(6, s)}
        <div class="shots">${s.shots.map(([f, h, p]) => `<figure class="shot"><img src="shots/${f}.png" alt="${h}" data-missing="${s.missing} · ${h}"><figcaption><b>${h}</b><span>${p}</span></figcaption></figure>`).join('')}</div>
        <p class="why-sim">${s.why}</p>
        ${foot(6, src('physio'))}</section>`;
}

function slide7() {
    const s = t().s7;
    return `<section class="slide">${head(7, s)}
        <div class="impact">${s.imp.map(([i, h, p]) => `<div class="card"><h3>${ico(i)}${h}</h3><p>${p}</p></div>`).join('')}</div>
        <div class="road">${s.road.map(([k, when, p]) => `<div class="step ${k}"><span class="when">${when}</span><p>${p}</p></div>`).join('')}</div>
        <div class="vision">${svg('star')}<p>${s.vision}</p></div>
        <div class="refs"><h4>${s.refsT}</h4><ol>${REFS.map((r) => `<li>${r}</li>`).join('')}</ol></div>
        ${foot(7)}</section>`;
}

const SLIDES = [slide1, slide2, slide3, slide4, slide5, slide6, slide7];

// ---------------------------------------------------------------- navigation
const params = new URLSearchParams(location.search);
const saved = (() => { try { return localStorage.getItem('orbitcare-deck-lang'); } catch { return null; } })();
lang = (['ar', 'en'].includes(params.get('lang')) ? params.get('lang') : saved) === 'ar' ? 'ar' : 'en';
let index = Math.min(SLIDES.length - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
const $ = (sel) => document.querySelector(sel);

// a screenshot that is not there becomes a labelled placeholder
function fixImages(root) {
    root.querySelectorAll('img[data-missing]').forEach((img) => {
        const swap = () => { const d = document.createElement('div'); d.className = 'ph'; d.textContent = img.dataset.missing; img.replaceWith(d); };
        if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener('error', swap, { once: true });
    });
}
function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('[data-slides]').innerHTML = SLIDES.map((f) => f()).join('');
    fixImages($('[data-slides]'));
    $('[data-lang]').textContent = t().lang;
    $('[data-full]').textContent = t().full;
    show(index);
}
function show(i) {
    index = Math.min(SLIDES.length - 1, Math.max(0, i));
    document.querySelectorAll('[data-slides] .slide').forEach((el, k) => { el.classList.toggle('is-active', k === index); el.setAttribute('aria-hidden', String(k !== index)); });
    $('[data-count]').textContent = `${index + 1} / ${SLIDES.length}`;
    $('[data-progress]').style.width = `${((index + 1) / SLIDES.length) * 100}%`;
    history.replaceState(null, '', `${location.search}#${index + 1}`);
}
const next = () => show(index + 1);
const prev = () => show(index - 1);
function toggleLang() { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('orbitcare-deck-lang', lang); } catch { /* not remembered */ } render(); }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
$('[data-next]').addEventListener('click', next);
$('[data-prev]').addEventListener('click', prev);
$('[data-lang]').addEventListener('click', toggleLang);
$('[data-full]').addEventListener('click', toggleFull);
document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const rtl = lang === 'ar', k = e.key;
    if (k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === (rtl ? 'ArrowLeft' : 'ArrowRight')) { e.preventDefault(); next(); }
    else if (k === 'PageUp' || k === 'ArrowUp' || k === (rtl ? 'ArrowRight' : 'ArrowLeft')) { e.preventDefault(); prev(); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(SLIDES.length - 1);
    else if (k === 'l' || k === 'L') toggleLang();
    else if (k === 'f' || k === 'F') toggleFull();
});
$('[data-stage]').addEventListener('click', (e) => { if (!e.target.closest('a')) next(); });
let idleTimer;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500); };
document.addEventListener('mousemove', wake);
wake();

if (params.has('print')) {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.add('print');
    document.body.insertAdjacentHTML('beforeend', `<div class="print-pages">${SLIDES.map((f) => `<div class="page"><div class="stage">${f().replace('class="slide', 'class="slide is-active')}</div></div>`).join('')}</div>`);
    fixImages($('.print-pages'));
    const page = document.createElement('style');
    page.textContent = '@page { size: 1600px 900px; margin: 0; }';
    document.head.append(page);
} else {
    render();
}
</script>
</body>
</html>
