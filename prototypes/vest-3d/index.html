     built as an industrial-design model: sculpted mannequin, paneled vest, bevelled sensor housings, studio light.
     Sensor placement: physiology + the sources listed on the page.

:root {
    --navy: #1b2350; --ink: #1b2340; --text: #3a4263; --muted: #6b7393; --line: #e5e8f4;

* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }   /* the live chip and back link stay hidden until live data arrives */
html, body { height: 100%; }
body { min-height: 100vh; background: var(--page); color: var(--text); font-family: var(--font); }
button { font: inherit; cursor: pointer; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; padding: 1.1rem 1.5rem; }
.brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--navy); }
.brand svg { width: 1.6rem; height: 1.6rem; color: var(--accent); }
.titles { flex: 1; min-width: 14rem; }
.titles h1 { font-size: 1.45rem; font-weight: 700; color: var(--ink); }
.titles p { margin-top: 0.15rem; font-size: 0.9rem; color: var(--muted); }
.chip { padding: 0.3rem 0.8rem; border-radius: 999px; background: #fff4dd; color: #a86c06; font-size: 0.8rem; font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tool { min-height: 2.4rem; padding: 0 0.9rem; border: 1px solid #d3d9eb; border-radius: 999px; background: #fff; color: var(--ink); font-size: 0.875rem; }
.tool:hover { border-color: var(--accent); color: var(--accent); }
.tool[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; gap: 1.25rem; padding: 0 1.5rem 1.5rem; }
.stage { position: relative; min-height: 34rem; height: calc(100vh - 7rem); border: 1px solid var(--line); border-radius: 1.25rem;
    background: radial-gradient(ellipse at 50% 28%, #f7f8fa 0%, #e4e6eb 55%, #cfd2da 100%); overflow: hidden; box-shadow: 0 10px 30px rgba(31, 45, 110, 0.06); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.label { position: absolute; display: flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem 0.2rem 0.25rem;
    border-radius: 999px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 4px 14px rgba(27, 35, 80, 0.14);
    font-size: 0.78rem; font-weight: 500; color: var(--ink); white-space: nowrap; transform: translate(-50%, -140%);
    pointer-events: auto; cursor: pointer; transition: opacity 0.2s ease; border: 1px solid transparent; }
[dir="rtl"] .label { padding: 0.2rem 0.25rem 0.2rem 0.6rem; }
.label.is-selected { border-color: var(--accent); background: #fff; }
.label.is-hidden { opacity: 0; pointer-events: none; }
.num { display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem; border-radius: 50%; color: #fff; font-size: 0.72rem; font-weight: 700; flex: none; }
.hint { position: absolute; inset-inline-start: 1rem; bottom: 1rem; padding: 0.4rem 0.75rem; border-radius: 0.6rem; background: rgba(255, 255, 255, 0.85); font-size: 0.8rem; color: var(--muted); }
.legend { position: absolute; inset-inline-end: 1rem; top: 1rem; display: grid; gap: 0.35rem; padding: 0.6rem 0.8rem; border-radius: 0.75rem; background: rgba(255, 255, 255, 0.88); font-size: 0.78rem; }
.legend span { display: flex; align-items: center; gap: 0.45rem; }
.legend i { width: 0.65rem; height: 0.65rem; border-radius: 50%; }
.legend .ring { background: transparent; border: 2px dashed var(--muted); }

.panel { display: flex; flex-direction: column; gap: 1rem; max-height: calc(100vh - 7rem); overflow-y: auto; padding: 1.25rem; border: 1px solid var(--line); border-radius: 1.25rem; background: var(--card); box-shadow: 0 10px 30px rgba(31, 45, 110, 0.06); }
.panel h2 { font-size: 1.05rem; font-weight: 600; color: var(--ink); }
.panel h3 { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
.sensor-list { display: grid; gap: 0.35rem; padding: 0; list-style: none; }
.sensor-btn { display: flex; align-items: center; gap: 0.6rem; width: 100%; padding: 0.55rem 0.65rem; border: 1px solid var(--line); border-radius: 0.8rem; background: #fff; text-align: start; color: var(--ink); }
.sensor-btn:hover { border-color: #b9c6ea; }
.sensor-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sensor-btn strong { flex: 1; font-weight: 500; font-size: 0.9rem; }
.cat { padding: 0.15rem 0.5rem; border-radius: 0.4rem; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }

.cat[data-cat="body"] { background: #e3f7ee; color: #198553; }
.cat[data-cat="radiation"] { background: #fbf5d8; color: #8a7406; }

.detail { padding: 1rem; border-radius: 1rem; background: #f6f7fb; }
.detail-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
.detail-head h3 { flex: 1; font-size: 1rem; }
.detail dl { display: grid; gap: 0.55rem; }
.detail dt { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }
.detail dd { margin: 0.1rem 0 0; font-size: 0.88rem; line-height: 1.55; color: var(--text); }
.offbody { display: grid; gap: 0.5rem; padding: 0; list-style: none; font-size: 0.85rem; line-height: 1.5; }
.offbody li { padding: 0.6rem 0.75rem; border: 1px dashed #cfd6ea; border-radius: 0.75rem; }
.offbody strong { color: var(--ink); font-weight: 600; }
.periodic { padding: 1rem; border: 1px solid #d9e1f5; border-radius: 1rem; background: linear-gradient(180deg, #f4f7ff 0%, #ffffff 100%); }
.periodic h3 { display: flex; align-items: center; gap: 0.5rem; }
.periodic h3::before { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--accent); }
.periodic-intro { margin-top: 0.3rem; font-size: 0.8rem; line-height: 1.5; color: var(--muted); }
.periodic-list { display: grid; gap: 0.6rem; margin-top: 0.75rem; padding: 0; list-style: none; }
.periodic-list li { padding: 0.75rem; border-radius: 0.8rem; background: #fff; border: 1px solid var(--line); }
.periodic-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.35rem 0.6rem; }
.periodic-head strong { font-size: 0.9rem; font-weight: 600; color: var(--ink); }
.periodic-when { padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.periodic-list p { margin-top: 0.4rem; font-size: 0.82rem; line-height: 1.55; color: var(--text); }
.periodic-list .periodic-note { color: var(--muted); font-size: 0.78rem; }
/* live: this astronaut's recorded signals, shown on the sensor that would measure them */
.back { display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none; }
.back svg { width: 1rem; height: 1rem; }
[dir="rtl"] .back svg { transform: scaleX(-1); }
.live-chip { display: inline-flex; align-items: center; gap: 0.4rem; background: #e3f7ee; color: #157a4b; }
.live-chip::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #1fa463; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.label-val { margin-inline-start: 0.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.live { margin-bottom: 0.9rem; padding: 0.85rem; border-radius: 0.85rem; background: #fff; border: 1px solid var(--line); }
.live-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.live-head span:last-child { font-variant-numeric: tabular-nums; }
.live-values { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 0.45rem; }
.live-val { display: grid; }
.live-val b { display: flex; align-items: baseline; gap: 0.3rem; font-size: 1.6rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.live-val b small { font-size: 0.78rem; font-weight: 500; color: var(--muted); }
.live-val > span { display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: var(--text); }
.live-val i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c7ccdd; }
.live-val i[data-c="GREEN"] { background: #1fa463; } .live-val i[data-c="YELLOW"] { background: #e6a01c; } .live-val i[data-c="RED"] { background: #e23d50; }
.live canvas { display: block; width: 100%; height: 4.5rem; margin-top: 0.6rem; border-radius: 0.5rem; background: #f6f7fb; }
.live-wave-name { margin-top: 0.3rem; font-size: 0.72rem; color: var(--muted); }
.live-src { margin-top: 0.45rem; font-size: 0.72rem; line-height: 1.5; color: var(--muted); }
.sources { font-size: 0.75rem; line-height: 1.6; color: var(--muted); }
.sources a { color: var(--accent); }

@media (max-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .stage { height: 75vh; min-height: 28rem; }
    .panel { max-height: none; }
}
@media (max-width: 560px) {
    .top, .layout { padding-inline: 1rem; }
    .legend { display: none; }
}

function canvasTexture(size, draw, repeat) {

}

    g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
    for (let y = 0; y < s; y += 4) for (let x = 0; x < s; x += 4) {
        const over = ((x + y) / 4) % 2 === 0;
        g.fillStyle = over ? '#9a9a9a' : '#6a6a6a'; g.fillRect(x, y, 4, 2);
        g.fillStyle = over ? '#727272' : '#929292'; g.fillRect(x, y + 2, 4, 2);

    for (let row = -1, y = 0; y < s + dy; row++, y += dy) for (let x = (row % 2) * dx / 2; x < s + dx; x += dx) {

        for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }

// Torso cross-sections: superellipse rings (half width a, half depth b, roundness n) by world height y.
const RINGS = [
    [0.1, 0.13, 0.11, 2.1], [0.17, 0.215, 0.14, 2.3], [0.26, 0.24, 0.145, 2.4], [0.36, 0.24, 0.142, 2.35],
    [0.44, 0.232, 0.138, 2.3], [0.52, 0.24, 0.142, 2.35], [0.6, 0.258, 0.15, 2.45], [0.68, 0.275, 0.158, 2.55],

// Catmull-Rom through the ring table → smooth body without creases.
function ringAt(y) {
    const i = Math.max(1, Math.min(RINGS.length - 2, RINGS.findIndex((r) => r[0] >= y)));
    const p0 = RINGS[Math.max(0, i - 2)], p1 = RINGS[i - 1], p2 = RINGS[i], p3 = RINGS[Math.min(RINGS.length - 1, i + 1)];
    const f = THREE.MathUtils.clamp((y - p1[0]) / (p2[0] - p1[0]), 0, 1);
    const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f * f + (-a + 3 * b - 3 * c + d) * f * f * f);
    return [cr(p0[1], p1[1], p2[1], p3[1]), cr(p0[2], p1[2], p2[2], p3[2]), cr(p0[3], p1[3], p2[3], p3[3])];
}
function superPoint(a, b, n, t) {
    const s = Math.sin(t), c = Math.cos(t);
    return [a * Math.sign(s) * Math.abs(s) ** (2 / n), b * Math.sign(c) * Math.abs(c) ** (2 / n)];
}
function surfaceNormal(y, t) {
    const [a, b, n] = ringAt(y);
    const [x, z] = superPoint(a, b, n, t);
    const nx = (n / a) * Math.sign(x) * Math.abs(x / a) ** (n - 1), nz = (n / b) * Math.sign(z) * Math.abs(z / b) ** (n - 1);
    return new THREE.Vector3(nx, 0, nz).normalize();
}
function surfacePoint(y, t, off = 0) {
    const [a, b, n] = ringAt(y);
    const [x, z] = superPoint(a, b, n, t);
    return new THREE.Vector3(x, y, z).addScaledVector(surfaceNormal(y, t), off);
}
// A surface following the torso between two heights, with an offset and a face filter (material per face).
function torsoSurface(y0, y1, off, faceMaterial, stepsY = 90, stepsT = 160) {
    const pos = [], uv = [];
    for (let iy = 0; iy <= stepsY; iy++) {
        const y = y0 + (y1 - y0) * iy / stepsY;
        for (let it = 0; it <= stepsT; it++) {
            const t = -Math.PI + 2 * Math.PI * it / stepsT;
            const p = surfacePoint(y, t, off);
            pos.push(p.x, p.y, p.z); uv.push(it / stepsT, (y - y0) / (y1 - y0));
        }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    const groups = {};
    const row = stepsT + 1;
    for (let iy = 0; iy < stepsY; iy++) for (let it = 0; it < stepsT; it++) {
        const y = y0 + (y1 - y0) * (iy + 0.5) / stepsY, t = -Math.PI + 2 * Math.PI * (it + 0.5) / stepsT;
        const m = faceMaterial(y, t);
        if (m < 0) continue;
        const a = iy * row + it, b = a + 1, c = a + row, d = c + 1;
        (groups[m] ??= []).push(a, c, b, b, c, d);
    }
    const index = [];
    for (const [m, list] of Object.entries(groups)) {
        geo.addGroup(index.length, list.length, Number(m));
        for (const v of list) index.push(v);   // (not push(...list): ~100k arguments overflows the call stack)
    }
    geo.setIndex(index);
    geo.computeVertexNormals();
    return geo;
}
// Lathe profiles must run bottom → top, or the surface is built inside-out (faces pointing inwards).
const latheMesh = (points, material, segments = 64) => new THREE.Mesh(new THREE.LatheGeometry(
    points.slice().sort((p, q) => p[1] - q[1]).map(([r, y]) => new THREE.Vector2(r, y)), segments), material);

    const pts = [];

        const f = i / steps;
        pts.push(surfacePoint(from.y + (to.y - from.y) * f, from.t + (to.t - from.t) * f, off));
    }
    return pts;
}
// Lays a part flat on the surface (its local Y = the surface normal) with its width kept horizontal.
function orient(mesh, normal) {
    const across = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
    const down = new THREE.Vector3().crossVectors(across, normal);
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(across, normal, down));
}
// Bevelled rounded-rectangle housing (width x height, thickness), lying in XZ with thickness along +Y.
function housing(w, h, d, radius = 0.01, bevel = 0.0025) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2, r = Math.min(radius, w / 2, h / 2);
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);

    geo.rotateX(-Math.PI / 2);   // thickness → +Y (the surface normal after orient())
    return geo;
}

// A strap around a limb (arm or leg group, in its local frame) with a small housing on its outer face.
function limbStrap(s, limb, y, radius, height, outward, housingSize) {

    strap.material.side = THREE.DoubleSide; strap.position.y = y; register(s, strap, limb);

    const box = new THREE.Mesh(housing(w, h, d, 0.008, 0.002), own(M.polymer));
    box.position.copy(outward.clone().multiplyScalar(radius + d / 2)).setY(y); orient(box, outward); register(s, box, limb);
    limb.updateMatrixWorld(true);
    const point = limb.localToWorld(outward.clone().multiplyScalar(radius + 0.05).setY(y + 0.03));
    const normal = outward.clone().applyQuaternion(limb.getWorldQuaternion(new THREE.Quaternion())).normalize();
    return { point, normal, box };
}

for (const s of SENSORS) {
    if (s.kind === 'electrodes') {
        s.points.forEach((p, i) => {
            const n = surfaceNormal(p.y, p.t);
            const pad = new THREE.Mesh(housing(0.046, 0.046, 0.004, 0.012, 0.0012), own(M.electrode));
            pad.position.copy(surfacePoint(p.y, p.t, 0.003)); orient(pad, n); register(s, pad);
            const snap = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0075, 0.006, 20), M.metal);

    } else if (s.kind === 'headband') {

        const led = new THREE.Mesh(new THREE.CircleGeometry(0.0032, 16), M.glow);

        const y = 1.3, rx = HEAD_AT(y) + 0.008, rz = rx * 1.12;
        for (const t of [-0.55, 0.55]) {
            const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.004, 20), own(M.electrode));

            for (let k = 0; k < 4; k++) flat(new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.0018), new THREE.MeshBasicMaterial({ color: 0x15171b }))).position.copy(onFace(0, 0.02 - k * 0.006 + 0.012));

            const imu = SENSORS.find((x) => x.id === 'imu');

}

// ================================================================ interaction
let turn = null;
function select(id, face) {
    selected = id;
    renderDetail();
    const s = SENSORS.find((x) => x.id === id);
    if (s.inside && !xray) setXray(true);
    if (face) {
        setAutoRotate(false);
        const a = anchors[id];
        const radius = Math.min(camera.position.distanceTo(controls.target), 2.6);
        const azimuth = Math.atan2(a.normal.x, a.normal.z);
        const targetY = THREE.MathUtils.clamp(a.point.y, -0.2, 1.28);
        turn = {
            fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
            toTarget: new THREE.Vector3(0, targetY, 0),
            toPos: new THREE.Vector3(Math.sin(azimuth) * radius, targetY + 0.14, Math.cos(azimuth) * radius),
            start: performance.now(), ms: reduceMotion ? 1 : 750,
        };
    }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const pickTargets = () => (xray ? pickables : pickables.filter((m) => !insideParts.includes(m)));
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = canvas.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickTargets(), false)[0];
    if (hit) select(hit.object.userData.sensor, true);
});
canvas.addEventListener('pointermove', (e) => {

    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);

});

// ================================================================ live readings (signed-in OrbitCare user)
// The same replay as the dashboard: numbers from GET /api/health/current, the recording's real 125 Hz
// waveforms from GET /api/health/waveform, each shown on the sensor that would measure it.
// Opened without a session, or offline, the page simply stays a static preview.
const LIVE = {
    ecg: { metrics: [['heart_rate', 'u_bpm']], channel: 'ecg', seconds: 5, sharp: 3 },
    ppg: { metrics: [['spo2', 'u_pct'], ['pulse_rate', 'u_bpm']], channel: 'ppg', seconds: 5, sharp: 1.5 },
    breath: { metrics: [['respiratory_rate', 'u_brpm']], channel: 'resp', seconds: 12, sharp: 1 },
};
// Sensors fed by open recorded data (GET /api/health/sensors) or by the astronaut's own daily check-in.
const OPEN = {
    temp: { sensor: 'skin_temperature', unit: 'u_c', digits: 1, from: 'body' },
    gsr: { sensor: 'skin_conductance', unit: 'u_rel', digits: 2, from: 'body' },
    imu: { sensor: 'movement', unit: 'u_rel', digits: 3, from: 'body' },
    dose: { sensor: 'radiation_dose_rate', unit: 'u_ugyh', digits: 1, from: 'nasa' },
    emg: { checkin: 'exercise' },
};
let open = null;    // newest /health/sensors response
const astronautId = /^\d+$/.test(params.get('astronaut_id') ?? '') ? params.get('astronaut_id') : null;
const LAG = 2;      // traces run this many seconds behind the newest sample, so they scroll smoothly
let live = null;    // { metrics: { name: metric }, replay }
let wave = null;    // newest waveform window from the server
let cursor = 0;     // recording time (s) at the right edge of the traces

const fmt = (v) => String(Math.round(v));
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function getApi(path, query = '') {
    const q = new URLSearchParams(query);
    if (astronautId) q.set('astronaut_id', astronautId);
    const response = await fetch(`../../api/${path}?${q}`, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
    const body = await response.json();
    if (!response.ok || !body.ok) throw new Error(`HTTP ${response.status}`);
    return body.data;
}

async function pollCurrent() {
    try {
        const data = await getApi('health/current');
        if (!data.replay) throw new Error('no data source');
        const first = live === null;
        live = { metrics: Object.fromEntries(data.metrics.map((m) => [m.metric, m])), replay: data.replay };
        if (first) startLive();
        renderLive();
    } catch (error) {
        if (live === null) return;   // not signed in, or offline: keep the static preview
    }
    setTimeout(pollCurrent, 2000);
}

function startLive() {
    document.querySelector('[data-live-chip]').hidden = false;
    const back = document.querySelector('[data-back]');
    // mission admins come from a crew member's page: go back there
    try { if (astronautId && new URL(document.referrer).origin === location.origin) back.href = document.referrer; } catch { /* no referrer: dashboard */ }
    back.hidden = false;
    pollWave();
    pollOpen();
}

async function pollOpen() {
    try {
        open = await getApi('health/sensors');
        renderLive();
    } catch { /* keep the last values; the next poll retries */ }
    setTimeout(pollOpen, 2000);
}

const fmtN = (v, digits) => Number(v).toFixed(digits);
const isoDate = (iso) => (iso ? String(iso).slice(0, 10) : '');

// Value, trend and source for a sensor fed by open data or by the check-in; '' when there is nothing to show.
function openBlock(id) {
    const cfg = OPEN[id];
    const reading = cfg.sensor ? open?.sensors?.[cfg.sensor] : null;
    const checkin = open?.self_reported ?? null;
    const vals = [];
    let srcText = '';
    if (reading) {
        vals.push(`<div class="live-val"><b>${esc(fmtN(reading.value, cfg.digits))}<small>${esc(tr(cfg.unit))}</small></b><span><i></i>${esc(tr(`m_${cfg.sensor}`))}</span></div>`);
        if (cfg.from === 'nasa') {
            vals.push(`<div class="live-val"><b>${esc(fmtN(reading.recording_mean, 1))}<small>${esc(tr(cfg.unit))}</small></b><span><i></i>${esc(tr('m_day_mean'))}</span></div>`);
            srcText = tr('src_nasa').replace('{date}', isoDate(reading.measured_at)).replace('{daily}', fmtN(reading.recording_mean_daily_mgy, 2));
        } else {
            srcText = tr('src_body').replace('{n}', reading.source.id.replace('noneeg:Subject', ''));
        }
    }
    if (cfg.checkin === 'exercise' || id === 'dose') {
        if (checkin) {
            if (id === 'dose' && checkin.radiation_dose_msv !== null) {
                vals.push(`<div class="live-val"><b>${esc(fmtN(checkin.radiation_dose_msv, 3))}<small>mSv</small></b><span><i></i>${esc(tr('m_logged_dose'))}</span></div>`);
            }
            if (cfg.checkin === 'exercise') {
                vals.push(`<div class="live-val"><b>${esc(String(checkin.resistance_minutes))}<small>${esc(tr('u_min'))}</small></b><span><i></i>${esc(tr('m_resistance'))}</span></div>`);
                vals.push(`<div class="live-val"><b>${esc(String(checkin.aerobic_minutes))}<small>${esc(tr('u_min'))}</small></b><span><i></i>${esc(tr('m_aerobic'))}</span></div>`);
            }
            srcText += `${srcText ? ' ' : ''}${tr('src_checkin').replace('{date}', checkin.date)}`;
        } else if (cfg.checkin === 'exercise') {
            srcText = tr('no_checkin');
        }
    }
    if (!vals.length && !srcText) return '';
    return `<div class="live-head"><span>${esc(tr(reading ? 'live_now' : 'checkin_head'))}</span><span></span></div>
        ${vals.length ? `<div class="live-values">${vals.join('')}</div>` : ''}
        ${reading ? `<span data-live-slot></span><p class="live-wave-name">${esc(tr(cfg.from === 'nasa' ? 'w_dose' : 'w_body'))}</p>` : ''}
        <p class="live-src">${esc(srcText)}</p>`;
}

async function pollWave() {
    try {
        const data = await getApi('health/waveform', 'seconds=12');
        if (data.available) {
            const running = data.replay?.status === 'running';
            wave = { ...data, running, speed: data.replay?.speed ?? 1 };
            if (!running) cursor = data.end_seconds;
            else if (cursor > data.end_seconds || cursor < data.end_seconds - 4) cursor = Math.max(0, data.end_seconds - LAG);
        } else {
            wave = null;
        }
    } catch { /* keep the last window; the next poll retries */ }
    setTimeout(pollWave, 1000);
}

function renderLive() {
    for (const [id, cfg] of Object.entries(LIVE)) {
        const el = document.querySelector(`[data-label-val="${id}"]`);
        const m = live?.metrics[cfg.metrics[0][0]];
        if (el) el.textContent = m?.available ? `· ${fmt(m.value)}${cfg.metrics[0][1] === 'u_pct' ? '%' : ''}` : '';
    }
    for (const [id, cfg] of Object.entries(OPEN)) {
        const el = document.querySelector(`[data-label-val="${id}"]`);
        const r = cfg.sensor ? open?.sensors?.[cfg.sensor] : null;
        if (el) el.textContent = r && cfg.from ? `· ${fmtN(r.value, cfg.digits === 3 ? 2 : Math.min(cfg.digits, 1))}${cfg.unit === 'u_c' ? '°' : ''}` : '';
    }
    const box = document.querySelector('[data-live]');
    if (!box) return;
    if (live && OPEN[selected]) {
        const html = openBlock(selected);
        box.className = html ? 'live' : '';
        box.innerHTML = html;
        box.querySelector('[data-live-slot]')?.replaceWith(liveCanvas);
        return;
    }
    const cfg = LIVE[selected];
    if (!live || !cfg) { box.className = ''; box.innerHTML = ''; return; }
    const r = live.replay;
    const recorded = r.mode === 'recorded_data_replay';
    const values = cfg.metrics.map(([key, unit]) => {
        const m = live.metrics[key];
        return `<div class="live-val"><b>${m?.available ? fmt(m.value) : '—'}<small>${esc(tr(unit))}</small></b>
            <span><i data-c="${m?.available ? esc(m.classification) : ''}"></i>${esc(tr(`m_${key}`))}</span></div>`;
    }).join('');
    const anyValue = cfg.metrics.some(([key]) => live.metrics[key]?.available);
    box.className = 'live';
    box.innerHTML = `
        <div class="live-head"><span>${esc(tr('live_now'))}</span><span>${esc(r.status === 'completed' ? tr('live_done') : tr('live_rec').replace('{t}', mmss(r.position_seconds)))}</span></div>
        <div class="live-values">${values}</div>
        ${anyValue ? '' : `<p class="live-src">${esc(tr('live_none'))}</p>`}
        ${recorded ? `<span data-live-slot></span><p class="live-wave-name">${esc(tr(`w_${cfg.channel}`))}</p>
        <p class="live-src">${esc(tr('live_src').replace('{record}', r.record_id ?? ''))}</p>` : ''}`;
    // the same canvas is moved back in, so the trace never blinks when the numbers refresh
    box.querySelector('[data-live-slot]')?.replaceWith(liveCanvas);
}
const liveCanvas = document.createElement('canvas');
liveCanvas.dataset.liveWave = '';

// Samples of one channel ending at the cursor, plus their range (for scaling and for the glow).
function liveWindow(cfg) {
    const data = wave?.channels?.[cfg.channel];
    if (!data?.length) return null;
    const end = Math.min(data.length, Math.round((cursor - wave.start_seconds) * wave.fs));
    const span = Math.round(cfg.seconds * wave.fs);
    const start = end - span;
    let lo = Infinity, hi = -Infinity;
    for (let i = Math.max(0, start); i < end; i++) if (data[i] !== null) { lo = Math.min(lo, data[i]); hi = Math.max(hi, data[i]); }
    if (!(hi > lo)) return null;
    return { data, start, end, span, lo, hi };
}

// 0..1: where the newest sample sits in the window — the sensor glows with each real heartbeat / breath.
function liveLevel(cfg) {
    const w = liveWindow(cfg);
    const v = w?.data[w.end - 1];
    return v === null || v === undefined ? null : ((v - w.lo) / (w.hi - w.lo)) ** cfg.sharp;
}

function drawLive(dt) {
    if (wave?.running) cursor = Math.min(wave.end_seconds, cursor + dt * wave.speed);
    const cfg = LIVE[selected];
    const c = document.querySelector('[data-live-wave]');
    if (!c || !(cfg || OPEN[selected])) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (!cfg) { drawSeries(g, w, h); return; }
    const win = liveWindow(cfg);
    if (!win) return;
    const color = SENSORS.find((s) => s.id === selected).color;
    g.strokeStyle = color; g.lineWidth = 1.6; g.lineJoin = 'round';
    g.beginPath();
    let pen = false;
    for (let i = Math.max(0, win.start); i < win.end; i++) {
        const v = win.data[i];
        if (v === null) { pen = false; continue; }   // a gap in the recording stays a gap
        const x = ((i - win.start) / win.span) * w;
        const y = h - 6 - ((v - win.lo) / (win.hi - win.lo)) * (h - 12);
        if (pen) g.lineTo(x, y); else { g.moveTo(x, y); pen = true; }
    }
    g.stroke();
}

// Trend of a 1-per-second (body) or about 1-per-minute (dose) open-data series, oldest at the left.
function drawSeries(g, w, h) {
    const series = open?.sensors?.[OPEN[selected].sensor]?.series;
    if (!series || series.length < 2) return;
    const t0 = series[0][0], t1 = series[series.length - 1][0];
    let lo = Infinity, hi = -Infinity;
    for (const [, v] of series) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    g.strokeStyle = SENSORS.find((s) => s.id === selected).color;
    g.lineWidth = 1.8; g.lineJoin = 'round';
    g.beginPath();
    series.forEach(([t, v], i) => {
        const x = t1 > t0 ? ((t - t0) / (t1 - t0)) * w : w / 2;
        const y = h - 6 - ((v - lo) / (hi - lo)) * (h - 12);
        if (i) g.lineTo(x, y); else g.moveTo(x, y);
    });
    g.stroke();
}

// ================================================================ render loop
function resize() {
    const { clientWidth: w, clientHeight: h } = stage;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const tmp = new THREE.Vector3();
const toCamera = new THREE.Vector3();
function placeLabels() {
    const { clientWidth: w, clientHeight: h } = stage;
    for (const s of SENSORS) {
        const a = anchors[s.id];
        tmp.copy(a.point).applyMatrix4(body.matrixWorld);
        toCamera.copy(camera.position).sub(tmp).normalize();
        const facing = a.normal.dot(toCamera) > 0.15;
        tmp.project(camera);
        const el = labelEls[s.id];
        el.style.left = `${(tmp.x * 0.5 + 0.5) * w}px`;
        el.style.top = `${(-tmp.y * 0.5 + 0.5) * h}px`;
        el.classList.toggle('is-hidden', !facing);
    }
}
const ease = (f) => 1 - (1 - f) ** 3;
let lastFrame = null;
function frame(now) {
    const dt = lastFrame === null ? 0 : Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    drawLive(dt);
    if (turn) {
        const f = Math.min(1, (now - turn.start) / turn.ms);
        camera.position.lerpVectors(turn.fromPos, turn.toPos, ease(f));
        controls.target.lerpVectors(turn.fromTarget, turn.toTarget, ease(f));
        if (f >= 1) turn = null;
    }
    // The selected sensor lights up in its legend colour. With live data, the ECG electrodes, the
    // headband pulse sensor and the breathing band glow with the recording's own beats and breaths.
    const pulse = reduceMotion ? 0.45 : 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 280));
    for (const s of SENSORS) {
        const level = wave && LIVE[s.id] && !reduceMotion ? liveLevel(LIVE[s.id]) : null;
        const glow = level !== null ? (s.id === selected ? 0.1 : 0.04) + (s.id === selected ? 0.75 : 0.45) * level
            : s.id === selected ? pulse : 0;
        for (const m of meshesBySensor[s.id] ?? []) {
            if (!m.material.emissive) continue;
            m.material.emissive.set(s.color);
            m.material.emissiveIntensity = glow;
        }
    }
    controls.update();
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(frame);
}

renderTexts();
setXray(params.has('xray'));
if (SENSORS.some((s) => s.id === params.get('sensor'))) select(params.get('sensor'), true);
requestAnimationFrame(frame);
pollCurrent();
</script>
</body>
</html>
